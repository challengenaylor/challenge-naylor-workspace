const RENDERERS = { temps: viewTemps, reheat: viewReheat, goods: viewGoods, calib: viewCalib, illness: viewIllness, settings: viewSettings };

function render() {
  const meta = VIEWS.find(v => v.id === view) || VIEWS[0];
  $('#viewTitle').textContent = meta.label;
  $('#crumb').textContent = meta.weekly ? meta.crumb + ' · ' + weekLabel(current) : meta.crumb;
  $('#weekNav').classList.toggle('sm:flex', meta.weekly);
  $('#weekNavMobile').classList.toggle('hidden', !meta.weekly);
  $('#weekPick').value = current;
  $('#weekPickMobile').value = current;

  const active = document.activeElement;
  const focusKey = active && active.dataset && (active.dataset.f || active.dataset.temp || active.dataset.action)
    ? [active.dataset.f || '', active.dataset.temp || '', active.dataset.action || '', active.dataset.id || '', active.dataset.day || ''].join('|')
    : null;

  $('#app').innerHTML = '<div class="view">' + RENDERERS[view]() + '</div>';
  stamp();

  if (focusKey) {
    const back = $$('#app [data-f], #app [data-temp], #app [data-action]').find(el =>
      el.offsetParent !== null &&
      [el.dataset.f || '', el.dataset.temp || '', el.dataset.action || '', el.dataset.id || '', el.dataset.day || ''].join('|') === focusKey);
    if (back) { back.focus(); if (back.setSelectionRange && back.type !== 'number' && back.type !== 'date' && back.type !== 'time') { const n = back.value.length; try { back.setSelectionRange(n, n); } catch (e) {} } }
  }
}
function paintRibbon() { const el = $('#ribbon'); if (el) el.innerHTML = tempsRibbon(); }

/* ══════════════════════════════════════════════════════════════
   14. EDITING  —  every field writes straight through to storage
   ══════════════════════════════════════════════════════════════ */
function collOf(name) {
  if (name === 'reheat' || name === 'deliveries') return week()[name];
  if (name === 'calibration') return db.calibration;
  if (name === 'illness')     return db.illness;
  if (name === 'equipment')   return db.equipment;
  if (name === 'suppliers')   return db.suppliers;
  return null;
}
const eqById = id => db.equipment.find(e => e.id === id);

function cellOf(eqId, day) {
  const w = week();
  if (!w.temps[eqId]) w.temps[eqId] = {};
  if (!w.temps[eqId][day]) w.temps[eqId][day] = { v: '', action: '' };
  return w.temps[eqId][day];
}

$('#app').addEventListener('input', e => {
  const el = e.target;

  /* temperature grid */
  if (el.dataset.temp) {
    const eq = eqById(el.dataset.temp);
    const cell = cellOf(el.dataset.temp, el.dataset.day);
    cell.v = el.value;
    syncTempCell(el, eq, cell);
    paintRibbon(); save(true);
    return;
  }
  if (el.dataset.action) {
    const cell = cellOf(el.dataset.action, el.dataset.day);
    cell.action = el.value;
    const tc = el.parentElement.querySelector('.tcell');
    if (tc) tc.classList.toggle('unresolved', !el.value.trim());
    paintRibbon(); save(true);
    return;
  }
  if (el.id === 'doneBy') { week().doneBy = el.value; save(true); return; }

  /* everything else: data-f="collection.field" or "business.field" */
  const f = el.dataset.f;
  if (!f) return;
  const [coll, key] = f.split('.');

  if (coll === 'business') {
    db.business[key] = el.value;
    if (key === 'trading' || key === 'name' || key === 'plan') paintNav();
    save(true); return;
  }
  const list = collOf(coll);
  if (!list) return;
  const rec = list.find(r => r.id === el.dataset.id);
  if (!rec) return;
  rec[key] = el.value;

  /* live restyle of numeric fields without a full re-render */
  const tc = el.closest('.tcell');
  if (tc) {
    if (coll === 'reheat')      tc.dataset.state = el.value === '' ? '' : (Number(el.value) < 75 ? 'bad' : 'hot');
    if (coll === 'deliveries')  tc.dataset.state = el.value === '' ? '' : (Number(el.value) > (rec.type === 'Frozen' ? -15 : 5) ? 'bad' : 'ok');
    if (coll === 'calibration' && key === 'ice')  tc.dataset.state = el.value === '' ? '' : (Math.abs(Number(el.value)) > 1 ? 'bad' : 'ok');
    if (coll === 'calibration' && key === 'boil') tc.dataset.state = el.value === '' ? '' : (Math.abs(Number(el.value) - 100) > 1 ? 'bad' : 'hot');
  }
  if (coll === 'equipment' && (key === 'name' || key === 'limit')) paintRibbon();
  save(true);
});

/* selects and dates commit on change → safe to redraw */
$('#app').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f && (el.tagName === 'SELECT' || el.type === 'date')) render();
});

/* the grid's own name field lives outside data-f */
$('#app').addEventListener('input', e => {
  if (!e.target.dataset.eqname) return;
  const eq = eqById(e.target.dataset.eqname);
  if (eq) { eq.name = e.target.value; save(true); }
});

function syncTempCell(input, eq, cell) {
  const wrap = input.closest('.tempwrap');
  const state = tempState(cell.v, eq);
  wrap.dataset.state = state;
  let ta = wrap.querySelector('textarea[data-action]');
  if (state === 'bad' && !ta) {
    ta = document.createElement('textarea');
    ta.rows = 2;
    ta.className = 'note';
    ta.dataset.action = eq.id; ta.dataset.day = input.dataset.day;
    ta.placeholder = 'Corrective action taken…';
    ta.value = cell.action || '';
    wrap.appendChild(ta);
  } else if (state !== 'bad' && ta) {
    ta.remove(); cell.action = '';
  }
  wrap.classList.toggle('unresolved', state === 'bad' && !String(cell.action || '').trim());
}

/* ══════════════════════════════════════════════════════════════
   15. ACTIONS
   ══════════════════════════════════════════════════════════════ */
const ACTIONS = {
  goSettings: () => go('settings'),
  pickDay: el => { mobileDay = el.dataset.day; render(); },
  toggleTheme: () => applyTheme(!document.documentElement.classList.contains('dark')),

  weekPrev: () => { const d = mondayOf(current); d.setDate(d.getDate() - 7); current = iso(d); mobileDay = todayKey(); render(); },
  weekNext: () => { const d = mondayOf(current); d.setDate(d.getDate() + 7); current = iso(d); mobileDay = todayKey(); render(); },
  weekToday: () => { current = weekKey(new Date()); mobileDay = todayKey(); render(); toast('Back to this week'); },
  openWeek: el => { current = el.dataset.week; mobileDay = todayKey(); go('temps'); },
  delWeek: el => {
    const k = el.dataset.week;
    confirmAction({ title: 'Delete this week?', body: weekLabel(k) + ' — temperatures, reheat checks and deliveries all go. Download a PDF first if you need it.' },
      () => { delete db.weeks[k]; if (current === k) current = weekKey(new Date()); save(); render(); toast('Week deleted'); });
  },

  addEquip: () => { db.equipment.push({ id: uid(), name: '', mode: 'chilled', limit: 5, note: '' }); save(); render(); toast('Unit added'); },
  delEquip: el => {
    const eq = eqById(el.dataset.id);
    confirmAction({ title: 'Delete ' + (eq.name || 'this unit') + '?', body: 'Its column comes out of every week, and the temperatures recorded against it are removed too.' },
      () => {
        db.equipment = db.equipment.filter(e => e.id !== el.dataset.id);
        Object.values(db.weeks).forEach(w => { if (w.temps) delete w.temps[el.dataset.id]; });
        save(); render(); toast('Unit deleted');
      });
  },

  addSupplier: () => { db.suppliers.push({ id: uid(), name: '', address: '', contact: '', cats: [] }); save(); render(); toast('Supplier added'); },
  delSupplier: el => {
    const s = db.suppliers.find(x => x.id === el.dataset.id);
    confirmAction({ title: 'Delete ' + (s.name || 'this supplier') + '?', body: 'Deliveries already logged against them keep the name — only the directory entry goes.' },
      () => { db.suppliers = db.suppliers.filter(x => x.id !== el.dataset.id); save(); render(); toast('Supplier deleted'); });
  },
  toggleCat: el => {
    const s = db.suppliers.find(x => x.id === el.dataset.id);
    s.cats = s.cats || [];
    const c = el.dataset.cat;
    s.cats = s.cats.includes(c) ? s.cats.filter(x => x !== c) : s.cats.concat(c);
    save(); render();
  },

  addMenu: () => {
    const inp = $('#newMenu'); const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if (db.menuItems.includes(v)) { toast('Already on the list', 'warn'); return; }
    db.menuItems.push(v); save(); render(); toast('Menu item added');
  },
  delMenu: el => { db.menuItems.splice(Number(el.dataset.i), 1); save(); render(); },

  addReheat: () => { week().reheat.push({ id: uid(), day: todayKey(), item: '', method: '', start: '', temp: '', actions: '' }); save(); render(); },
  delReheat: el => confirmAction({ title: 'Delete this reheat check?' }, () => {
    const w = week(); w.reheat = w.reheat.filter(r => r.id !== el.dataset.id); save(); render(); toast('Check deleted'); }),

  addDelivery: () => { week().deliveries.push({ id: uid(), day: todayKey(), supplier: '', type: 'Chilled', items: '', temp: '', notes: '' }); save(); render(); },
  delDelivery: el => confirmAction({ title: 'Delete this delivery?' }, () => {
    const w = week(); w.deliveries = w.deliveries.filter(r => r.id !== el.dataset.id); save(); render(); toast('Delivery deleted'); }),

  addCalib: () => { db.calibration.unshift({ id: uid(), date: iso(new Date()), name: '', type: 'Probe', ice: '', boil: '', actions: '' }); save(); render(); },
  delCalib: el => confirmAction({ title: 'Delete this calibration check?' }, () => {
    db.calibration = db.calibration.filter(r => r.id !== el.dataset.id); save(); render(); toast('Check deleted'); }),

  addIllness: () => { db.illness.unshift({ id: uid(), name: '', symptoms: '', actions: '', final: '', returned: '' }); save(); render(); },
  delIllness: el => confirmAction({ title: 'Delete this illness record?', body: 'Illness records support your staff exclusion decisions. Keep them unless this one was entered by mistake.' },
    () => { db.illness = db.illness.filter(r => r.id !== el.dataset.id); save(); render(); toast('Record deleted'); }),

  move: el => {
    const list = collOf(el.dataset.coll);
    const i = list.findIndex(r => r.id === el.dataset.id);
    const j = i + Number(el.dataset.dir);
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    save(); render();
  },

  exportView: () => exportSection(view),
  exportYear: () => exportEverything(),
  exportWeeklyReport: () => exportWeeklyReport(),
  exportJSON: () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NP3-backup-' + iso(new Date()) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('Backup downloaded');
  },
  importJSON: () => $('#importFile').click(),
  wipe: () => confirmAction({ title: 'Erase every record?', body: 'All weeks, suppliers, equipment and illness records are removed from this browser. Download a backup first if you might want any of it back.', yes: 'Erase everything' },
    () => { db = seed(); current = weekKey(new Date()); save(); paintNav(); render(); toast('Everything erased'); })
};

function todayKey() {
  const t = new Date();
  return (weekKey(t) === current) ? DAYS[(t.getDay() + 6) % 7].k : 'mon';
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const fn = ACTIONS[btn.dataset.act];
  if (fn) { e.preventDefault(); fn(btn); }
});

$('#weekPick').addEventListener('change', e => { if (e.target.value) { current = weekKey(e.target.value); render(); } });
$('#weekPickMobile').addEventListener('change', e => { if (e.target.value) { current = weekKey(e.target.value); render(); } });

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { toast("That file isn't a readable backup.", 'bad'); return; }
    if (!data || typeof data !== 'object' || (!data.weeks && !data.equipment)) { toast("That file isn't an NP3 backup.", 'bad'); return; }
    confirmAction({ kind: 'Restore', title: 'Replace what\'s here with this backup?', body: 'Everything currently in this browser is overwritten by the contents of ' + file.name + '.', yes: 'Restore backup', tone: 'ink' },
      () => {
        db = Object.assign(seed(), data);
        current = weekKey(new Date());
        save(); paintNav(); render(); toast('Backup restored');
      });
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ══════════════════════════════════════════════════════════════
   0. THEME  —  light by default; .dark on <html> switches every
   colour token in the file at once (see the :root / html.dark
   variable blocks in <style>). The pre-paint script in <head>
   already applied any stored choice before this ever runs.
   ══════════════════════════════════════════════════════════════ */
const SUN_ICON  = '<path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="10" r="3.6" stroke="currentColor" stroke-width="1.6"/>';
const MOON_ICON = '<path d="M16.5 12.4A7 7 0 018 4c0-.6.06-1.1.16-1.6A7.5 7.5 0 1017.9 12a7 7 0 01-1.4.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';

function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('np3.theme', dark ? 'dark' : 'light'); } catch (e) {}
  $('#themeIcon').innerHTML = dark ? SUN_ICON : MOON_ICON;
  $('#themeToggle').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}

/* ══════════════════════════════════════════════════════════════
   16. PDF EXPORT  —  real vector text via jsPDF + autoTable, not a
   rasterised screenshot. Every section is built from plain data
   (columns/rows), so the same builder produces every section's PDF,
   and columns are sized by autoTable to always fit the page — the
   thing the old screenshot-based export couldn't guarantee.
   ══════════════════════════════════════════════════════════════ */

/* jsPDF's built-in fonts don't have glyphs for <= / >= (they render as a
   stray quote mark) — everything else we use (+/- deg em-dash middot) is
   fine. Swap just those two, only in PDF-bound text. Applied centrally in
   drawPdfTable to every cell, not left to each section builder to remember. */
const pdfSafe = s => String(s == null ? '' : s).replace(/\u2264/g, '<=').replace(/\u2265/g, '>=');

function pdfCell(text, flagged) {
  // a leading "!" marks a cell for the flagged (red) treatment in didParseCell;
  // sanitization itself happens once, centrally, in drawPdfTable
  return (flagged ? '!' : '') + String(text == null ? '' : text);
}

function pdfMargin() { return { left: 12, right: 12, top: 32, bottom: 16 }; }

function drawPdfLetterhead(doc, title, sub) {
  const margin = pdfMargin();
  const pageW = doc.internal.pageSize.getWidth();
  const b = db.business;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(10, 15, 20);
  doc.text(pdfSafe(title), margin.left, 16);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 70, 80);
  const bizLine = pdfSafe(b.trading || b.name) + (b.trading && b.name && b.trading !== b.name ? '   \u00b7   ' + pdfSafe(b.name) : '');
  doc.text(bizLine, margin.left, 21.5);
  doc.text(pdfSafe(b.address), margin.left, 25.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(10, 15, 20);
  doc.text(pdfSafe(b.plan || 'National Programme 3'), pageW - margin.right, 16, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(60, 70, 80);
  if (sub) doc.text(pdfSafe(sub), pageW - margin.right, 20.5, { align: 'right' });
  doc.text('Printed ' + nzDate(new Date()), pageW - margin.right, 25, { align: 'right' });
  doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.6);
  doc.line(margin.left, 28.5, pageW - margin.right, 28.5);
}

function drawPdfFooterLeft(doc, sub) {
  const margin = pdfMargin();
  const pageH = doc.internal.pageSize.getHeight();
  const b = db.business;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(100, 100, 100);
  doc.text(pdfSafe(sub || ('Retain for at least 4 years \u00b7 ' + (b.trading || b.name))), margin.left, pageH - 8);
}

function drawPdfPageNumber(doc, page, total) {
  const margin = pdfMargin();
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(100, 100, 100);
  doc.text('Page ' + page + ' of ' + total, pageW - margin.right, pageH - 8, { align: 'right' });
}

/* the actual autoTable call (or empty-state message), factored out so
   both the per-section export (fixed startY/margin, one table per
   page) and the weekly report (tables flowing one after another,
   sharing pages when they fit) can drive it with their own Y
   positions instead of duplicating the column/styling setup twice. */
function runPdfAutoTable(doc, data, startY, marginTop) {
  const margin = pdfMargin();
  if (!data.rows.length) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(120, 120, 120);
    doc.text(pdfSafe(data.emptyMessage || 'No records for this period.'), margin.left, startY + 4);
    return;
  }
  // sanitize every cell centrally here — a "!"-flagged cell keeps its
  // flag but has the rest of its text passed through pdfSafe, and a
  // plain cell (e.g. limitText()'s "<= 5C") is never at risk of a
  // section builder having forgotten to call pdfSafe itself
  const body = data.rows.map(row => row.map(cell => {
    const raw = String(cell == null ? '' : cell);
    const flagged = raw.charAt(0) === '!';
    return (flagged ? '!' : '') + pdfSafe(flagged ? raw.slice(1) : raw);
  }));
  doc.autoTable({
    startY,
    margin: { left: margin.left, right: margin.right, top: marginTop, bottom: margin.bottom },
    head: [data.columns.map(pdfSafe)],
    body,
    theme: 'grid',
    styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2, lineColor: [190, 200, 208], lineWidth: 0.15, overflow: 'linebreak', valign: 'top', textColor: [20, 30, 40] },
    headStyles: { fillColor: [236, 241, 244], textColor: [20, 30, 40], fontStyle: 'bold', fontSize: 7.5 },
    didParseCell: cellData => {
      if (typeof cellData.cell.raw === 'string' && cellData.cell.raw.charAt(0) === '!') {
        cellData.cell.text = [cellData.cell.raw.slice(1)];
        cellData.cell.styles.fillColor = [251, 234, 234];
        cellData.cell.styles.textColor = [150, 20, 20];
        cellData.cell.styles.fontStyle = 'bold';
      }
    }
  });
}

function drawPdfSignoff(doc, y, signedBy) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(20, 20, 20);
  doc.text('Task done by: ' + pdfSafe(signedBy || '________________________'), pdfMargin().left, y);
}

/* the table (or empty-state message) and, for weekly logs, the
   signature line. Columns auto-fit the page width via autoTable, and
   a table too long for one page continues with the header row
   repeated — both are autoTable's core, guaranteed behaviour as long
   as the reserved top margin (pdfMargin().top) is respected, which is
   why the letterhead is stamped in a separate pass afterward rather
   than through a per-page draw hook (see buildCombinedDoc). */
function drawPdfTable(doc, data) {
  const margin = pdfMargin();
  runPdfAutoTable(doc, data, margin.top, margin.top);
  if (!data.rows.length) return;
  if (data.showSignoff) {
    const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY : margin.top + 10;
    drawPdfSignoff(doc, finalY + 8, data.signedBy);
  }
}

/* builds one PDF containing every section passed in, each starting on
   its own page (landscape when it has more than 6 columns — the
   temperature grid's 7 day columns — portrait otherwise) and each
   keeping its own letterhead/footer text. A single section is just
   the n=1 case, so exportSection and exportEverything share this one
   code path instead of two. */
function buildCombinedDoc(sections) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  const ranges = [];
  sections.forEach(data => {
    const orientation = data.columns.length > 6 ? 'landscape' : 'portrait';
    if (!doc) doc = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
    else doc.addPage('a4', orientation);
    const from = doc.internal.getNumberOfPages();
    drawPdfTable(doc, data);
    const to = doc.internal.getNumberOfPages();
    ranges.push({ from, to, data });
  });
  // letterhead + section-specific footer, scoped to each section's own
  // page range so an earlier section's pages never get relabelled with
  // a later section's title
  ranges.forEach(r => {
    for (let p = r.from; p <= r.to; p++) {
      doc.setPage(p);
      drawPdfLetterhead(doc, r.data.title, r.data.sub);
      drawPdfFooterLeft(doc, r.data.sub);
    }
  });
  // page numbers only make sense once the whole document's page count
  // is final, so this runs as one last pass over everything
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) { doc.setPage(p); drawPdfPageNumber(doc, p, total); }
  return doc;
}

/* Temperature log + Incoming goods together in one PDF, flowing as one
   document rather than each forcing its own page (that's what
   buildCombinedDoc is for). One letterhead, at the very top of page 1
   only; Incoming Goods either continues right below the temperature
   table on the same page if there's reasonably room, or starts fresh
   at the top of a new page with its own heading if not — and either
   way, autoTable's normal page-break/repeated-header behaviour is
   what actually protects a long table from ever being cut mid-row. */
function buildWeeklyReportDoc(tempsData, goodsData) {
  const { jsPDF } = window.jspdf;
  const margin = pdfMargin();
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const pageH = doc.internal.pageSize.getHeight();
  const contTop = 16; // lean top margin for pages that are pure table continuation

  // one letterhead, page 1 only — its bold title doubles as the first
  // section's own heading, so nothing else needs to introduce "Daily
  // fridge temperature monitoring" a second time
  drawPdfLetterhead(doc, tempsData.title, tempsData.sub);

  runPdfAutoTable(doc, tempsData, margin.top, contTop);
  let y = doc.lastAutoTable ? doc.lastAutoTable.finalY : margin.top + 10;
  if (tempsData.showSignoff && tempsData.rows.length) {
    y += 8;
    drawPdfSignoff(doc, y, tempsData.signedBy);
  }
  y += 12; // breathing room before the next section heading

  // enough room left on this page for a heading plus a non-cramped
  // first slice of the goods table? if not, start goods clean on a
  // new page instead of squeezing in a heading with nothing under it
  const neededForGoods = goodsData.rows.length ? 32 : 14;
  if (pageH - margin.bottom - y < neededForGoods) {
    doc.addPage('a4', 'landscape');
    y = 20;
  }

  // "Incoming Goods" heading, styled to match the letterhead's own
  // title exactly (same weight/size/colour) — that's the "first
  // section heading" the goods heading is matching
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(10, 15, 20);
  doc.text(pdfSafe(goodsData.title), margin.left, y);
  y += 6;

  runPdfAutoTable(doc, goodsData, y, contTop);
  let goodsY = doc.lastAutoTable ? doc.lastAutoTable.finalY : y + 10;
  if (goodsData.showSignoff && goodsData.rows.length) {
    goodsY += 8;
    drawPdfSignoff(doc, goodsY, goodsData.signedBy);
  }

  // footer + page numbers on every page, once the whole document
  // (however many pages either table ended up needing) is final
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    drawPdfFooterLeft(doc, tempsData.sub);
    drawPdfPageNumber(doc, p, total);
  }
  return doc;
}

function exportWeeklyReport() {
  const tempsData = sectionPdfData('temps', current);
  const goodsData = sectionPdfData('goods', current);
  const doc = buildWeeklyReportDoc(tempsData, goodsData);
  doc.save('NP3-Weekly-Report-wc-' + current + '.pdf');
  toast('PDF downloaded');
}

/* one function per section, returning plain {title, sub, columns, rows,
   signedBy, emptyMessage} — buildCombinedDoc turns that into the
   actual PDF. Keeping this as data (not markup) is what lets every
   section share one renderer, one auto-fit/pagination path, and one
   page-numbering pass. */
function sectionPdfData(id, wk) {
  const w = wk ? (db.weeks[wk] || { temps: {}, reheat: [], deliveries: [], doneBy: '' }) : null;
  const sub = wk ? 'Week commencing ' + nzDate(dayDate(wk, 0)) : '';

  if (id === 'temps') {
    const columns = ['Unit', 'Safe zone', ...DAYS.map((d, i) => d.l + '\n' + pad(dayDate(wk, i).getDate()) + '/' + pad(dayDate(wk, i).getMonth() + 1))];
    const rows = db.equipment.map(eq => {
      const cells = DAYS.map(d => {
        const c = ((w.temps || {})[eq.id] || {})[d.k] || {};
        const st = tempState(c.v, eq);
        const val = (c.v === '' || c.v == null) ? '\u2014' : c.v + '\u00b0C';
        return pdfCell(st === 'bad' ? val + (c.action ? ' \u2014 ' + c.action : ' \u2014 NO ACTION RECORDED') : val, st === 'bad');
      });
      return [eq.name, limitText(eq), ...cells];
    });
    return { title: 'Daily fridge temperature monitoring', sub, columns, rows, signedBy: w.doneBy, showSignoff: true,
      emptyMessage: db.equipment.length ? '' : 'No units have been set up yet.' };
  }

  if (id === 'reheat') {
    const rows = (w.reheat || []).map(r => {
      const bad = r.temp !== '' && r.temp != null && Number(r.temp) < 75;
      const tempTxt = r.temp === '' || r.temp == null ? '\u2014' : r.temp + '\u00b0C';
      return [dayName(r.day, wk), r.item || '\u2014', r.method || '\u2014', r.start || '\u2014',
        pdfCell(tempTxt, bad), r.actions || (bad ? 'NO ACTION RECORDED' : '')];
    });
    return { title: 'Reheated food temperature monitoring', sub, showSignoff: true, signedBy: w.doneBy,
      columns: ['Day', 'Menu item', 'How reheated', 'Start time', 'Temp', 'Actions taken if required'],
      rows, emptyMessage: 'No reheat checks recorded for this week.' };
  }

  if (id === 'goods') {
    const rows = (w.deliveries || []).map(r => {
      const lim = r.type === 'Frozen' ? -15 : 5;
      const bad = r.temp !== '' && r.temp != null && Number(r.temp) > lim;
      const tempTxt = r.temp === '' || r.temp == null ? '\u2014' : r.temp + '\u00b0C';
      return [dayName(r.day, wk), r.supplier || '\u2014', r.type || '\u2014', r.items || '\u2014', pdfCell(tempTxt, bad), r.notes || (bad ? 'NO ACTION RECORDED' : '')];
    });
    return { title: 'Incoming goods', sub, showSignoff: true, signedBy: w.doneBy,
      columns: ['Day', 'Supplier', 'Type', 'Items delivered', 'Temp', 'Notes'],
      rows, emptyMessage: 'No deliveries recorded for this week.' };
  }

  if (id === 'calib') {
    const rows = db.calibration.map(r => {
      const iceBad = r.ice !== '' && r.ice != null && Math.abs(Number(r.ice)) > 1;
      const boilBad = r.boil !== '' && r.boil != null && Math.abs(Number(r.boil) - 100) > 1;
      return [r.date ? nzDate(new Date(r.date + 'T00:00:00')) : '\u2014', r.name || '\u2014', r.type || '\u2014',
        pdfCell(r.ice === '' || r.ice == null ? '\u2014' : r.ice + '\u00b0C', iceBad),
        pdfCell(r.boil === '' || r.boil == null ? '\u2014' : r.boil + '\u00b0C', boilBad),
        r.actions || ((iceBad || boilBad) ? 'NO ACTION RECORDED' : '')];
    });
    return { title: 'Thermometer calibration', sub: 'Six-monthly record',
      columns: ['Date', 'Thermometer', 'Type', 'Ice point (0\u00b0C \u00b11)', 'Boil point (100\u00b0C \u00b11)', 'Actions taken if required'],
      rows, emptyMessage: 'No calibration checks recorded.' };
  }

  if (id === 'illness') {
    const rows = db.illness.map(r => [
      r.name || '\u2014', r.symptoms || '\u2014', r.actions || '\u2014',
      r.final ? nzDate(new Date(r.final + 'T00:00:00')) : '\u2014',
      r.returned ? nzDate(new Date(r.returned + 'T00:00:00')) : 'Not yet returned'
    ]);
    return { title: 'Staff illnesses', sub: 'Ongoing record',
      columns: ['Name', 'Symptoms', 'Actions taken', 'Final symptom', 'Returned to work'],
      rows, emptyMessage: 'No illnesses recorded.' };
  }

  // settings/directory: two related tables, exported as two sections
  // (each gets its own letterhead page) via the _extra hand-off
  const eqRows = db.equipment.map(eq => [eq.name, MODES[eq.mode || 'chilled'].label, limitText(eq), eq.note || '']);
  const supRows = db.suppliers.map(s => [s.name || '\u2014', s.address || '\u2014', s.contact || '\u2014', (s.cats || []).join(', ')]);
  return {
    title: 'Equipment directory', sub: '',
    columns: ['Unit', 'Mode', 'Safe zone', 'Note'], rows: eqRows,
    emptyMessage: 'No units have been set up yet.',
    _extra: { title: 'Supplier directory', sub: '', columns: ['Name', 'Address', 'Contact', 'Supplies'], rows: supRows, emptyMessage: 'No suppliers recorded.' }
  };
}

function dayName(k, wk) {
  const i = DAYS.findIndex(d => d.k === k);
  if (i < 0) return '\u2014';
  return DAYS[i].s + ' ' + pad(dayDate(wk, i).getDate()) + '/' + pad(dayDate(wk, i).getMonth() + 1);
}

function safeName(s) { return String(s).replace(/[^\w\s-]/g, '').replace(/\s+/g, '-'); }

function exportSection(id) {
  const meta = VIEWS.find(v => v.id === id);
  const wk = meta.weekly ? current : null;
  const d = sectionPdfData(id, wk);
  const sections = d._extra ? [d, d._extra] : [d];
  const doc = buildCombinedDoc(sections);
  doc.save('NP3-' + safeName(d.title) + (wk ? '-wc-' + wk : '') + '.pdf');
  toast('PDF downloaded');
}

function exportEverything() {
  const wks = knownWeeks().slice().reverse();
  const hasAnyData = wks.length || db.calibration.length || db.illness.length || db.equipment.length || db.suppliers.length;
  if (!hasAnyData) { toast('Nothing recorded yet', 'warn'); return; }
  const sections = [];
  wks.forEach(wk => ['temps', 'reheat', 'goods'].forEach(id => sections.push(sectionPdfData(id, wk))));
  ['calib', 'illness', 'settings'].forEach(id => {
    const d = sectionPdfData(id, null);
    sections.push(d);
    if (d._extra) sections.push(d._extra);
  });
  const doc = buildCombinedDoc(sections);
  doc.save('NP3-full-record-' + iso(new Date()) + '.pdf');
  toast('PDF downloaded');
}

/* ══════════════════════════════════════════════════════════════
   17. START
   ══════════════════════════════════════════════════════════════ */
const hash = location.hash.replace('#', '');
if (VIEWS.some(v => v.id === hash)) view = hash;
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#', '');
  if (VIEWS.some(v => v.id === h) && h !== view) { view = h; paintNav(); render(); }
});

async function startApp() {
  await loadFromCloud();
  paintNav();
  applyTheme(document.documentElement.classList.contains('dark'));
  render();
  stamp();
}
</script>

</div><!-- /#appWrap -->
<script>
  const gateEmail = document.getElementById('gateEmail');
  const gatePassword = document.getElementById('gatePassword');
  const gateMsg = document.getElementById('gateMsg');
  const authGate = document.getElementById('authGate');
  const logoutCorner = document.getElementById('logoutCorner');
  const appWrap = document.getElementById('appWrap');

  document.getElementById('gateBtn').addEventListener('click', async () => {
    gateMsg.textContent = '';
    try {
      await auth.signInWithEmailAndPassword(gateEmail.value.trim(), gatePassword.value);
    } catch (e) {
      gateMsg.textContent = 'Incorrect email or password.';
    }
  });
  logoutCorner.addEventListener('click', () => auth.signOut());

  let appHasStarted = false;
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      authGate.style.display = 'flex';
      logoutCorner.style.display = 'none';
      appWrap.style.display = 'none';
      return;
    }
    let allowed = false;
    try {
      const snap = await dbFS.collection('users').doc(user.uid).get();
      if (snap.exists) {
        const data = snap.data();
        allowed = data.role === 'admin' || (data.tools || []).includes(REQUIRED_TOOL_KEY);
      }
    } catch (e) { console.error(e); }

    if (!allowed) {
      gateMsg.textContent = "You don't have access to this tool.";
      auth.signOut();
      return;
    }

    authGate.style.display = 'none';
    logoutCorner.style.display = 'block';
    appWrap.style.display = 'block';
    if (!appHasStarted) { appHasStarted = true; startApp(); }
  });
</script>
