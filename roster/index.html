<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Roster</title>
<style>
  :root{
    --ink:#16161D; --ink-soft:#6B7280; --ink-faint:#9CA3AF;
    --accent:#4F46E5; --accent-dk:#3730A3; --accent-tint:#EEF2FF;
    --grey-line:#E5E7EB; --grey-fill:#F8F9FA; --grey-mid:#F3F4F6;
    --weekend:#F1F0FB; --holiday:#FEF3C7; --holiday-tx:#92400E;
    --discount:#FCE4F1; --discount-tx:#97266D;
    --warn-bg:#FEE2E2; --warn-tx:#B91C1C; --ok-bg:#D1FAE5; --ok-tx:#047857;
    --white:#FFFFFF; --radius:10px; --radius-sm:6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font); color:var(--ink); background:var(--white);
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-tint);}
  button{font-family:inherit;}
  input, select, textarea{font-family:inherit; font-size:13.5px;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}
  #sidebar{
    width:220px; flex-shrink:0; background:var(--grey-fill);
    border-right:1px solid var(--grey-line); padding:20px 12px;
    display:flex; flex-direction:column; gap:2px;
  }
  #sidebar .brand{
    font-size:15px; font-weight:700; padding:4px 10px 18px 10px; color:var(--ink);
    letter-spacing:-0.01em;
  }
  #sidebar .brand span{color:var(--accent);}
  .nav-btn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border:none;
    background:transparent; border-radius:var(--radius-sm); color:var(--ink-soft);
    font-size:13.5px; font-weight:500; text-align:left; cursor:pointer; width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-btn:hover{background:var(--grey-mid); color:var(--ink);}
  .nav-btn.active{background:var(--accent); color:#fff;}
  .nav-btn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0;}
  #sidebar .foot{margin-top:auto; padding:10px; font-size:11px; color:var(--ink-faint); line-height:1.5;}

  #main{flex:1; min-width:0; padding:28px 36px 60px 36px; max-width:1400px;}
  .page{display:none;}
  .page.active{display:block;}

  h1.page-title{font-size:22px; font-weight:700; margin:0 0 4px 0; letter-spacing:-0.01em;}
  p.page-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px 0; max-width:720px; line-height:1.5;}

  .card{
    background:#fff; border:1px solid var(--grey-line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .card + .card{margin-top:16px;}
  .card h2{font-size:14px; font-weight:700; margin:0 0 14px 0;}

  .row{display:flex; gap:16px; flex-wrap:wrap;}
  .kpi{
    flex:1; min-width:160px; background:#fff; border:1px solid var(--grey-line);
    border-radius:var(--radius); padding:16px 18px;
  }
  .kpi .label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .kpi .value{font-size:28px; font-weight:700; color:var(--accent-dk); margin-top:6px; letter-spacing:-0.01em;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--grey-line);
  }
  td{padding:8px 10px; border-bottom:1px solid var(--grey-mid); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.weekend td{background:var(--weekend);}
  tr.holiday td{background:var(--holiday); color:var(--holiday-tx); font-weight:600;}

  input[type=text], input[type=number], input[type=date], input[type=time], select{
    border:1px solid var(--grey-line); border-radius:var(--radius-sm); padding:6px 8px;
    background:#fff; color:var(--ink); width:100%;
  }
  input:focus, select:focus{outline:2px solid var(--accent-tint); border-color:var(--accent);}
  input:disabled{background:var(--grey-fill); color:var(--ink-faint);}

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--grey-line);
    background:#fff; color:var(--ink); padding:8px 14px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; cursor:pointer; transition:all .12s ease;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent-dk);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dk); border-color:var(--accent-dk); color:#fff;}
  .btn.danger{color:var(--warn-tx);}
  .btn.danger:hover{border-color:var(--warn-tx);}
  .btn.small{padding:5px 10px; font-size:12px;}

  .badge{display:inline-block; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .badge.ok{background:var(--ok-bg); color:var(--ok-tx);}
  .badge.warn{background:var(--warn-bg); color:var(--warn-tx);}
  .badge.info{background:var(--holiday); color:var(--holiday-tx);}
  .badge.muted{background:var(--grey-mid); color:var(--ink-soft);}
  .discount-badge{
    display:inline-block; background:var(--discount); color:var(--discount-tx);
    font-weight:700; font-size:10.5px; padding:1px 7px; border-radius:99px; margin-top:2px;
  }

  .alert{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; margin-bottom:10px; line-height:1.45;
  }
  .alert.warn{background:var(--warn-bg); color:var(--warn-tx);}
  .alert.info{background:var(--accent-tint); color:var(--accent-dk);}
  .alert.holiday{background:var(--holiday); color:var(--holiday-tx);}
  .alert.discount{background:var(--discount); color:var(--discount-tx);}
  .alert.ok{background:var(--ok-bg); color:var(--ok-tx);}

  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;}
  @media (max-width:1000px){ .grid-2{grid-template-columns:1fr;} }

  .weekbar{
    display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;
  }
  .weekbar .weeklabel{font-size:15px; font-weight:700;}
  .weekbar .navbtn{
    border:1px solid var(--grey-line); background:#fff; border-radius:var(--radius-sm);
    width:30px; height:30px; cursor:pointer; font-size:14px; color:var(--ink-soft);
  }
  .weekbar .navbtn:hover{border-color:var(--accent); color:var(--accent-dk);}

  .shift-cell{display:flex; flex-direction:column; gap:4px; min-width:150px;}
  .shift-cell .times{display:flex; gap:4px;}
  .shift-cell select[data-field]{width:auto; min-width:78px; padding:5px 4px; font-size:12px;}
  .shift-cell input[type=number]{width:52px; padding:5px 6px; font-size:12.5px;}
  .shift-cell .brknote{display:flex; gap:4px; align-items:center;}
  .shift-cell .brknote label{font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}
  .shift-cell input[type=text].notes{font-size:12px; padding:4px 6px;}
  .hours-pill{
    font-size:11.5px; font-weight:700; color:var(--accent-dk); background:var(--accent-tint);
    border-radius:99px; padding:1px 8px; display:inline-block; margin-top:2px; align-self:flex-start;
  }
  .hours-pill.zero{color:var(--ink-faint); background:var(--grey-mid);}
  .hours-pill.invalid{color:var(--warn-tx); background:var(--warn-bg);}

  .name-cell{font-weight:600; white-space:nowrap;}
  .status-pill{font-size:10.5px; padding:2px 7px; border-radius:99px; font-weight:700; margin-left:6px;}
  .status-pill.inactive{background:var(--grey-mid); color:var(--ink-faint);}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state .big{font-size:32px; margin-bottom:8px;}

  select#irEmployee, select#histWeekSelect, select#searchEmployee{max-width:240px;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    opacity:0; transform:translateY(8px); transition:all .2s ease; pointer-events:none; z-index:999;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .legend-swatch{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle;}

  /* ---------- Team Roster: bold grid, calm colors (scoped to this page only) ---------- */
  #teamPrintArea table.team-table,
  #teamPrintArea table.team-table th,
  #teamPrintArea table.team-table td{
    border: 1px solid #000 !important;
  }
  #teamPrintArea table.team-table{ border-collapse: collapse; }
  #teamPrintArea table.team-table th{ font-weight:700; color:var(--ink); }
  #teamPrintArea table.team-table td.name-cell{ font-weight:700; }
  #teamPrintArea table.team-table td{ font-weight:400; }

  #teamPrintArea .team-weekend{ background:#F1F0FB !important; color:var(--ink-soft) !important; }
  #teamPrintArea .team-holiday{ background:#FEF3C7 !important; color:#92400E !important; }
  #teamPrintArea .team-dayoff{ background:#FBEAEA !important; color:#9B4A46 !important; }
  #teamPrintArea .team-discount{ background:#FCE4F1 !important; color:#97266D !important; }
  #teamPrintArea .legend-swatch.team-weekend,
  #teamPrintArea .legend-swatch.team-holiday,
  #teamPrintArea .legend-swatch.team-dayoff,
  #teamPrintArea .legend-swatch.team-discount{ border:1px solid #000; }

  @media print{
    #teamPrintArea table.team-table, #teamPrintArea table.team-table th, #teamPrintArea table.team-table td{
      border: 1px solid #000 !important;
    }
    #teamPrintArea .team-weekend{ background:#F1F0FB !important; color:var(--ink-soft) !important; }
    #teamPrintArea .team-holiday{ background:#FEF3C7 !important; color:#92400E !important; }
    #teamPrintArea .team-dayoff{ background:#FBEAEA !important; color:#9B4A46 !important; }
    #teamPrintArea .team-discount{ background:#FCE4F1 !important; color:#97266D !important; }
  }

  @media print{
    @page{ size: landscape; margin: 10mm; }
    html, body{ -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }
    #sidebar, .no-print{display:none !important;}
    #main{padding:0; max-width:100%;}
    body{font-size:11px;}
    .card{border:none; padding:0;}
    table{width:100%;}
    th, td{
      border:1px solid #D8DAE0 !important;
      white-space:nowrap;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact;
    }
  }
  .sync-pill{
    position:fixed; top:14px; right:18px; font-size:11.5px; font-weight:700;
    padding:4px 10px; border-radius:99px; z-index:1000; transition:opacity .3s ease;
    background:var(--grey-mid); color:var(--ink-soft);
  }
  .sync-pill.saving{background:var(--accent-tint); color:var(--accent-dk);}
  .sync-pill.error{background:var(--warn-bg); color:var(--warn-tx);}
  .sync-pill.ok{opacity:0;}

  /* ---------- Mobile layout ---------- */
  @media (max-width:820px){
    #app{ flex-direction:column; }
    #sidebar{
      width:100%; flex-direction:row; overflow-x:auto; white-space:nowrap;
      padding:10px 10px; gap:6px; border-right:none; border-bottom:1px solid var(--grey-line);
      -webkit-overflow-scrolling:touch;
    }
    #sidebar .brand{ display:none; }
    #sidebar .foot{ display:none; }
    .nav-btn{ width:auto; flex-shrink:0; padding:9px 13px; }
    #main{ padding:16px 14px 50px 14px; max-width:100%; }
    h1.page-title{ font-size:19px; }
    p.page-sub{ font-size:13px; }
    .row{ flex-direction:column; }
    .grid-2{ grid-template-columns:1fr; }
    .card{ padding:14px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table{ min-width:640px; }
    .weekbar{ gap:8px; }
    .weekbar .weeklabel{ font-size:14px; }
    .sync-pill{ top:8px; right:8px; font-size:10px; padding:3px 8px; }
    .kpi{ min-width:130px; padding:14px 14px; }
    .kpi .value{ font-size:22px; }
  }
</style>

<body>
<div id="authGate">
  <div class="box">
    <h2>Sign in</h2>
    <p>Enter your login to access the Roster.</p>
    <input type="email" id="gateEmail" placeholder="Email">
    <input type="password" id="gatePassword" placeholder="Password">
    <button id="gateBtn">Sign in</button>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>
<div id="logoutCorner" style="display:none;">Log out</div>
<div class="sync-pill" id="syncPill">Loading…</div>
<div id="app" style="display:none;">
  <div id="sidebar">
    <div class="brand">Weekly<span>Roster</span></div>
    <button class="nav-btn" data-page="dashboard"><span class="dot"></span>Dashboard</button>
    <button class="nav-btn" data-page="roster"><span class="dot"></span>Roster</button>
    <button class="nav-btn" data-page="team"><span class="dot"></span>Team Roster</button>
    <button class="nav-btn" data-page="staff"><span class="dot"></span>Staff</button>
    <button class="nav-btn" data-page="holidays"><span class="dot"></span>Public Holidays</button>
    <button class="nav-btn" data-page="discounts"><span class="dot"></span>Discount Days</button>
    <button class="nav-btn" data-page="individual"><span class="dot"></span>Individual View</button>
    <button class="nav-btn" data-page="history"><span class="dot"></span>History</button>
    <button class="nav-btn" data-page="settings"><span class="dot"></span>Settings &amp; Backup</button>
    <div class="foot">Data saves automatically and syncs across all your devices.</div>
  </div>
  <div id="main">
    <!-- pages injected by JS render functions -->
    <div class="page" id="page-dashboard"></div>
    <div class="page" id="page-roster"></div>
    <div class="page" id="page-team"></div>
    <div class="page" id="page-staff"></div>
    <div class="page" id="page-holidays"></div>
    <div class="page" id="page-discounts"></div>
    <div class="page" id="page-individual"></div>
    <div class="page" id="page-history"></div>
    <div class="page" id="page-settings"></div>
  </div>
</div>
<script>
  const gateEmail = document.getElementById('gateEmail');
  const gatePassword = document.getElementById('gatePassword');
  const gateMsg = document.getElementById('gateMsg');
  const authGate = document.getElementById('authGate');
  const logoutCorner = document.getElementById('logoutCorner');
  const appDiv = document.getElementById('app');

  document.getElementById('gateBtn').addEventListener('click', async () => {
    gateMsg.textContent = '';
    try {
      await auth.signInWithEmailAndPassword(gateEmail.value.trim(), gatePassword.value);
    } catch (e) {
      gateMsg.textContent = 'Incorrect email or password.';
    }
  });
  logoutCorner.addEventListener('click', () => auth.signOut());

  let appHasStarted = false;
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      authGate.style.display = 'flex';
      logoutCorner.style.display = 'none';
      appDiv.style.display = 'none';
      return;
    }
    let allowed = false;
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      if (snap.exists) {
        const data = snap.data();
        allowed = data.role === 'admin' || (data.tools || []).includes(REQUIRED_TOOL_KEY);
      }
    } catch (e) { console.error(e); }

    if (!allowed) {
      gateMsg.textContent = "You don't have access to this tool.";
      auth.signOut();
      return;
    }

    authGate.style.display = 'none';
    logoutCorner.style.display = 'block';
    appDiv.style.display = 'flex';
    if (!appHasStarted) { appHasStarted = true; startApp(); }
  });
</script>

<script>
/* =========================================================================
   WEEKLY ROSTER — offline, single-file app. All data lives in this browser's
   localStorage (key "weeklyRosterData"). No network calls, no dependencies.
   ========================================================================= */

const STORAGE_KEY = "weeklyRosterData";
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_NAMES_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10); }

function defaultState(){
  const today = new Date();
  const weekStart = mondayOnOrBefore(today);
  const staff = [
    {id:uid("s"), name:"Simon", status:"active", email:""},
    {id:uid("s"), name:"Omar", status:"active", email:""},
    {id:uid("s"), name:"Sunil", status:"active", email:""},
    {id:uid("s"), name:"Jas", status:"active", email:""},
    {id:uid("s"), name:"Aman", status:"active", email:""},
  ];
  const weeks = {};
  weeks[isoDate(weekStart)] = { shifts: {} };
  return {
    staff,
    holidays: [
      {date:"2026-10-26", name:"Labour Day"},
      {date:"2026-12-25", name:"Christmas Day"},
      {date:"2026-12-26", name:"Boxing Day"}
    ],
    discountDays: [],
    weeks,
    currentWeek: isoDate(weekStart),
    overtimeThreshold: 40,
    settings: { showTotalsOnTeamRoster: true, defaultDiscountRate: 15 }
  };
}

// Fill in any fields missing from data saved by an earlier version of the app.
function migrateState(state){
  if(!state.settings) state.settings = {};
  if(typeof state.settings.showTotalsOnTeamRoster !== "boolean") state.settings.showTotalsOnTeamRoster = true;
  if(typeof state.settings.defaultDiscountRate !== "number") state.settings.defaultDiscountRate = 15;
  if(!Array.isArray(state.discountDays)) state.discountDays = [];
  for(const s of state.staff){ if(typeof s.email !== "string") s.email = ""; }
  for(const wkKey in state.weeks){
    const wk = state.weeks[wkKey];
    if(!wk.shifts) wk.shifts = {};
    for(const staffId in wk.shifts){
      const days = wk.shifts[staffId];
      if(!days) continue;
      for(let i=0;i<days.length;i++){
        if(days[i] && typeof days[i].off !== "boolean") days[i].off = false;
      }
    }
  }
  return state;
}

function mondayOnOrBefore(d){
  const x = new Date(d);
  const day = x.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0) ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function addDays(iso, n){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+n);
  return isoDate(d);
}
function fmtDate(iso, opts){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-NZ", opts || {day:"2-digit", month:"short", year:"numeric"});
}
function dayNameOf(iso){
  const d = new Date(iso+"T00:00:00");
  const jsDay = d.getDay(); // 0=Sun
  const idx = jsDay === 0 ? 6 : jsDay - 1; // convert to Mon=0..Sun=6
  return DAY_NAMES[idx];
}
function isWeekendIso(iso){
  const d = new Date(iso+"T00:00:00").getDay();
  return d === 0 || d === 6;
}

let STATE = null;

function setSyncPill(mode){
  const p = document.getElementById("syncPill");
  if(!p) return;
  p.classList.remove("saving","error","ok");
  if(mode === "loading"){ p.textContent = "Loading…"; p.style.opacity = "1"; }
  else if(mode === "saving"){ p.textContent = "Saving…"; p.classList.add("saving"); p.style.opacity = "1"; }
  else if(mode === "error"){ p.textContent = "Could not sync — check connection"; p.classList.add("error"); p.style.opacity = "1"; }
  else { p.textContent = "Saved"; p.classList.add("ok"); }
}

// Loads the shared roster from Firebase. Every device that opens this page
// reads from the same document, which is what keeps them all in sync.
async function loadState(){
  setSyncPill("loading");
  try{
    const snap = await rosterDocRef.get();
    if(snap.exists){
      STATE = migrateState(snap.data());
    } else {
      STATE = defaultState();
      await saveState();
    }
    setSyncPill("done");
  }catch(e){
    console.error("Could not load saved data from Firebase, starting fresh (offline).", e);
    STATE = defaultState();
    setSyncPill("error");
  }
}

// Saves the shared roster to Firebase so every other device sees the update.
async function saveState(){
  setSyncPill("saving");
  try{
    await rosterDocRef.set(STATE);
    setSyncPill("done");
  }catch(e){
    console.error(e);
    setSyncPill("error");
    showToast("Could not save — check your internet connection.");
  }
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------------------------------------------------------------------
   CORE DATA HELPERS
   --------------------------------------------------------------------- */
function getActiveStaff(){
  return STATE.staff.filter(s => s.status === "active");
}
function getStaffById(id){
  return STATE.staff.find(s => s.id === id);
}
function ensureWeek(weekStart){
  if(!STATE.weeks[weekStart]) STATE.weeks[weekStart] = { shifts: {} };
  return STATE.weeks[weekStart];
}
function getShift(weekStart, staffId, dayIndex){
  const wk = ensureWeek(weekStart);
  if(!wk.shifts[staffId]) wk.shifts[staffId] = [null,null,null,null,null,null,null];
  return wk.shifts[staffId][dayIndex] || { start:"", finish:"", brk:0, notes:"", off:false };
}
function setShift(weekStart, staffId, dayIndex, field, value){
  const wk = ensureWeek(weekStart);
  if(!wk.shifts[staffId]) wk.shifts[staffId] = [null,null,null,null,null,null,null];
  const existing = wk.shifts[staffId][dayIndex] || { start:"", finish:"", brk:0, notes:"", off:false };
  existing[field] = value;
  wk.shifts[staffId][dayIndex] = existing;
  saveState();
}
function setDayOff(weekStart, staffId, dayIndex, isOff){
  const wk = ensureWeek(weekStart);
  if(!wk.shifts[staffId]) wk.shifts[staffId] = [null,null,null,null,null,null,null];
  const existing = wk.shifts[staffId][dayIndex] || { start:"", finish:"", brk:0, notes:"", off:false };
  existing.off = isOff;
  if(isOff){ existing.start = ""; existing.finish = ""; existing.brk = 0; }
  wk.shifts[staffId][dayIndex] = existing;
  saveState();
}

// Hours calc — handles shifts that cross midnight. start/finish are "HH:MM" strings.
function computeHours(start, finish, brkMinutes){
  if(!start || !finish) return null;
  const [sh, sm] = start.split(":").map(Number);
  const [fh, fm] = finish.split(":").map(Number);
  let startMin = sh*60+sm, finishMin = fh*60+fm;
  let diff = finishMin - startMin;
  if(diff <= 0) diff += 24*60; // crossed midnight
  const brk = Number(brkMinutes)||0;
  const hours = (diff - brk) / 60;
  return hours;
}

// 24h "HH:MM" -> "h:MM AM/PM" for display
function to12h(hhmm){
  if(!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  const period = h < 12 ? "AM" : "PM";
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,"0")} ${period}`;
}

// Builds <option> list for a 30-minute-step time <select>, values stay 24h "HH:MM"
function timeOptionsHtml(selected){
  let html = `<option value="">--</option>`;
  for(let mins=0; mins<24*60; mins+=30){
    const h = Math.floor(mins/60), m = mins%60;
    const val = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    const label = to12h(val);
    html += `<option value="${val}" ${val===selected?"selected":""}>${label}</option>`;
  }
  return html;
}

function weekDates(weekStart){
  return Array.from({length:7}, (_,i)=> addDays(weekStart, i));
}

function holidayForDate(iso){
  return STATE.holidays.find(h => h.date === iso);
}
function discountForDate(iso){
  return STATE.discountDays.find(d => d.date === iso);
}

// Per-employee weekly total (active staff only counted on dashboard, but works for any id)
function weeklyHoursFor(weekStart, staffId){
  const wk = ensureWeek(weekStart);
  const shifts = wk.shifts[staffId];
  if(!shifts) return 0;
  let total = 0;
  for(const s of shifts){
    if(s && s.start && s.finish){
      const h = computeHours(s.start, s.finish, s.brk);
      if(h && h > 0) total += h;
    }
  }
  return total;
}

function totalLabourHours(weekStart){
  let total = 0;
  for(const s of STATE.staff){ total += weeklyHoursFor(weekStart, s.id); }
  return total;
}

function dailyStaffingCounts(weekStart){
  const dates = weekDates(weekStart);
  return dates.map((iso, dayIdx)=>{
    let count = 0;
    for(const s of getActiveStaff()){
      const sh = getShift(weekStart, s.id, dayIdx);
      if(sh.start && sh.finish) count++;
    }
    return count;
  });
}

function nextUpcomingHoliday(fromIso){
  const upcoming = STATE.holidays
    .filter(h => h.date >= fromIso)
    .sort((a,b)=> a.date.localeCompare(b.date));
  return upcoming[0] || null;
}
function nextUpcomingDiscountDay(fromIso){
  const upcoming = STATE.discountDays
    .filter(d => d.date >= fromIso)
    .sort((a,b)=> a.date.localeCompare(b.date));
  return upcoming[0] || null;
}

function mondayOnOrBeforeIso(iso){
  return isoDate(mondayOnOrBefore(new Date(iso+"T00:00:00")));
}

// Navigate to a week. If it's brand new (no shifts saved yet) and moving
// forward in time, automatically bring across the previous week's shifts
// so most weeks need little more than a few tweaks.
function goToWeek(target){
  const alreadyExists = !!STATE.weeks[target];
  ensureWeek(target);
  if(!alreadyExists){
    const prev = addDays(target, -7);
    if(STATE.weeks[prev] && STATE.weeks[prev].shifts && Object.keys(STATE.weeks[prev].shifts).length){
      STATE.weeks[target].shifts = JSON.parse(JSON.stringify(STATE.weeks[prev].shifts));
      showToast("Brought last week's shifts across — adjust as needed");
    }
  }
  STATE.currentWeek = target;
  saveState();
  RENDERERS.roster();
}

/* ---- Clean plain-text export for WhatsApp / email ---- */
function buildRosterText(weekStart, opts){
  opts = opts || {};
  const includeTotals = opts.includeTotals !== false;
  const plainOnly = !!opts.plainOnly;
  const dates = weekDates(weekStart);
  const active = getActiveStaff();
  const dayLabel = (iso,i) => DAY_NAMES_SHORT[i]+" "+fmtDate(iso,{day:"2-digit",month:"short"});

  const cellText = (weekStart, staffId, dayIdx) => {
    const sh = getShift(weekStart, staffId, dayIdx);
    if(sh.off) return "Day off";
    if(sh.start && sh.finish) return `${to12h(sh.start)}-${to12h(sh.finish)}`;
    return "-";
  };

  const nameColWidth = Math.max(3, ...active.map(s=>s.name.length)) + 2;
  const dayColWidth = 20;

  let lines = [];
  lines.push(`WEEKLY ROSTER`);
  lines.push(`${fmtDate(weekStart,{day:"2-digit",month:"short",year:"numeric"})} - ${fmtDate(addDays(weekStart,6),{day:"2-digit",month:"short",year:"numeric"})}`);
  lines.push("");

  const header = "Staff".padEnd(nameColWidth) + dates.map((iso,i)=> dayLabel(iso,i).padEnd(dayColWidth)).join("");
  lines.push(header);
  lines.push("-".repeat(header.length));

  for(const s of active){
    let row = s.name.padEnd(nameColWidth);
    for(let i=0;i<7;i++){
      row += cellText(weekStart, s.id, i).padEnd(dayColWidth);
    }
    lines.push(row);
  }

  if(includeTotals){
    lines.push("-".repeat(header.length));
    for(const s of active){
      const total = weeklyHoursFor(weekStart, s.id);
      lines.push(`${s.name.padEnd(nameColWidth)}Total: ${total.toFixed(2)}h`);
    }
    lines.push("");
    lines.push(`Total labour hours: ${totalLabourHours(weekStart).toFixed(2)}h`);
  }

  const body = lines.join("\n");
  return plainOnly ? body : ("```\n" + body + "\n```");
}

function copyToClipboard(text){
  // execCommand works reliably even when this file is opened directly (file://),
  // where the modern Clipboard API is often blocked as an insecure context.
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  if(ok){
    showToast("Roster copied — paste into WhatsApp or email");
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> showToast("Roster copied — paste into WhatsApp or email"),
      ()=> showToast("Couldn't copy automatically — select and copy the text manually")
    );
  } else {
    showToast("Couldn't copy automatically — select and copy the text manually");
  }
}

// Selects the rendered (styled) table itself and copies it — most email
// clients, Word and Google Docs paste this back as a real formatted table
// with colours. WhatsApp has no rich-text paste, so it will show plain text there.
function copyFormattedTable(containerId){
  const node = document.getElementById(containerId);
  if(!node){ showToast("Nothing to copy"); return; }
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  sel.removeAllRanges();
  if(ok) showToast("Copied with formatting — paste into Email, Word or Docs. (WhatsApp shows plain text only.)");
  else showToast("Couldn't copy automatically — try Print / Export PDF instead.");
}

        `}
      </div>

      <div class="card">
        <h2>Search by employee</h2>
        <select id="searchEmployee" style="margin-bottom:14px;">
          ${STATE.staff.map(s=>`<option value="${s.id}" ${s.id===histSearchEmployee?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
        </select>
        <div class="row" style="margin-bottom:14px;">
          <div class="kpi"><div class="label">All-time hours</div><div class="value">${allTimeTotal.toFixed(2)}</div></div>
          <div class="kpi"><div class="label">Weeks worked</div><div class="value">${searchRows.length}</div></div>
        </div>
        <table>
          <thead><tr><th>Week</th><th style="text-align:right;">Hours</th></tr></thead>
          <tbody>
          ${searchRows.slice().reverse().map(r=>`<tr><td>${fmtDate(r.week)}</td><td style="text-align:right;">${r.hours.toFixed(2)}</td></tr>`).join("") || `<tr><td colspan="2" style="color:var(--ink-faint);">No recorded hours yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const wsel = document.getElementById("histWeekSelect");
  if(wsel) wsel.addEventListener("change", e=>{ histSelectedWeek = e.target.value; RENDERERS.history(); });
  const esel = document.getElementById("searchEmployee");
  if(esel) esel.addEventListener("change", e=>{ histSearchEmployee = e.target.value; RENDERERS.history(); });
};

/* ---------------------------------------------------------------------
   SETTINGS & BACKUP — export/import is important: localStorage is the
   only copy of this data, tied to this one browser on this one computer.
   --------------------------------------------------------------------- */
RENDERERS.settings = function(){
  const el = document.getElementById("page-settings");
  const weekCount = Object.keys(STATE.weeks).length;
  const staffCount = STATE.staff.length;
  el.innerHTML = `
    <h1 class="page-title">Settings &amp; Backup</h1>
    <p class="page-sub">This roster saves itself automatically and syncs across every device. Still worth backing up occasionally as extra insurance.</p>

    <div class="card">
      <h2>Back up your data</h2>
      <p style="color:var(--ink-soft); margin:0 0 14px 0;">Currently storing ${staffCount} staff and ${weekCount} week${weekCount===1?"":"s"} of rosters.</p>
      <button class="btn primary" id="exportBtn">Download backup (.json)</button>
      <label class="btn" style="margin-left:10px;">
        Restore from backup
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </label>
    </div>

    <div class="card">
      <h2>Colour legend</h2>
      <div style="display:flex; flex-wrap:wrap; gap:18px; font-size:13px;">
        <div><span class="legend-swatch" style="background:var(--weekend);"></span>Weekend</div>
        <div><span class="legend-swatch" style="background:var(--holiday);"></span>Public holiday</div>
        <div><span class="legend-swatch" style="background:var(--warn-bg);"></span>Needs attention</div>
        <div><span class="legend-swatch" style="background:var(--ok-bg);"></span>OK</div>
        <div><span class="legend-swatch" style="background:var(--accent-tint);"></span>Info</div>
      </div>
    </div>

    <div class="card">
      <h2>Weekly workflow</h2>
      <ol style="margin:0; padding-left:18px; line-height:1.9; color:var(--ink-soft);">
        <li>Open <strong>Roster</strong> and click <strong>+ New week</strong> — dates and day names roll forward automatically.</li>
        <li>Choose whether to copy last week's shift pattern across, or start blank.</li>
        <li>Adjust the shifts that changed. Everything else — hours, totals, warnings — updates on its own.</li>
      </ol>
    </div>

    <div class="card">
      <h2>Reset</h2>
      <p style="color:var(--ink-soft); margin:0 0 14px 0;">Wipes all staff, shifts, and history from this browser. Cannot be undone — back up first.</p>
      <button class="btn danger" id="resetBtn">Erase all data</button>
    </div>
  `;

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "weekly-roster-backup-"+isoDate(new Date())+".json";
    a.click();
    showToast("Backup downloaded");
  });

  document.getElementById("importFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.staff || !parsed.weeks) throw new Error("not a roster backup file");
        if(confirm("This will replace all current data with the backup file. Continue?")){
          STATE = parsed;
          saveState();
          showToast("Backup restored");
          renderAll();
          showPage("dashboard");
        }
      }catch(err){
        alert("Could not read this file — it doesn't look like a Weekly Roster backup.");
      }
    };
    reader.readAsText(file);
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Erase ALL staff, shifts, holidays and history from this browser? This cannot be undone.")){
      STATE = defaultState();
      saveState();
      renderAll();
      showPage("dashboard");
      showToast("All data erased");
    }
  });
};

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
async function startApp(){
  await loadState();
  showPage("dashboard");
}
</script>
</body>
</html>
