<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Naylor — Workspace</title>
<style>
  :root{
    --bg:#F8F8F6;
    --card:rgba(255,255,255,0.78);
    --card-solid:#FFFFFF;
    --text:#0F172A;
    --text-secondary:#64748B;
    --border:rgba(15,23,42,0.08);
    --accent:#1E293B;
    --accent-soft:rgba(30,41,59,0.06);
    --success:#059669;
    --error:#B3402F;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.04), 0 1px 1px rgba(15,23,42,0.03);
    --shadow-md:0 4px 16px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.04);
    --shadow-lg:0 20px 48px rgba(15,23,42,0.10), 0 2px 6px rgba(15,23,42,0.04);
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.011em;
    line-height:1.5;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* =========================================================
     Ambient background — soft, quiet, not flashy
  ========================================================= */
  .ambient{
    position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .ambient span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:0.35;
  }
  .ambient span.a{ width:520px; height:520px; top:-160px; left:-120px; background:radial-gradient(circle,#CBD5E1,transparent 70%); }
  .ambient span.b{ width:460px; height:460px; bottom:-180px; right:-100px; background:radial-gradient(circle,#D1FAE5,transparent 70%); }

  /* =========================================================
     Header
  ========================================================= */
  header{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 32px;
    background:rgba(248,248,246,0.72);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--border);
  }
  header .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:700; font-size:1.02rem; letter-spacing:-0.01em; color:var(--text);
  }
  header .brand .mark{
    width:28px; height:28px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:.72rem; font-weight:800; letter-spacing:0;
  }
  header .brand .divider-dot{ color:var(--border); font-weight:400; }
  header .brand .sub{ color:var(--text-secondary); font-weight:500; }

  header nav{
    display:flex; gap:26px; flex-wrap:wrap; overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  header nav::-webkit-scrollbar{ display:none; }
  header nav a{
    position:relative;
    color:var(--text-secondary); text-decoration:none; font-size:.85rem; font-weight:600;
    padding:6px 1px; white-space:nowrap;
    transition:color 220ms var(--ease);
  }
  header nav a::after{
    content:''; position:absolute; left:0; right:100%; bottom:0; height:1.5px;
    background:var(--text); transition:right 250ms var(--ease);
  }
  header nav a:hover{ color:var(--text); }
  header nav a:hover::after{ right:0; }

  #hamburgerBtn{
    display:none; background:transparent; border:1px solid var(--border); border-radius:10px;
    width:38px; height:38px; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text); flex-shrink:0;
  }
  #mobileNavPanel{
    display:none; position:fixed; top:65px; left:12px; right:12px; z-index:150;
    background:var(--card-solid); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg); padding:8px; backdrop-filter:blur(20px);
  }
  #mobileNavPanel a{
    display:block; padding:13px 14px; border-radius:10px; color:var(--text);
    text-decoration:none; font-weight:600; font-size:.95rem;
  }
  #mobileNavPanel a:active{ background:var(--accent-soft); }
  #navBackdrop{
    display:none; position:fixed; inset:0; z-index:140; background:rgba(15,23,42,0.25);
  }
  @media (max-width:680px){
    header nav{ display:none; }
    #hamburgerBtn{ display:flex; }
  }

  #logoutBtn{
    background:transparent; color:var(--text-secondary); border:1px solid var(--border);
    padding:8px 18px; border-radius:99px;
    font-weight:600; font-size:.82rem; cursor:pointer; display:none;
    transition:all 220ms var(--ease);
    font-family:var(--sans);
  }
  #logoutBtn:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* =========================================================
     Login screen
  ========================================================= */
  #loginScreen{
    position:relative; z-index:1;
    min-height:calc(100vh - 68px);
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  #loginScreen .card{
    width:100%; max-width:398px;
    background:var(--card);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:44px 38px 38px;
    text-align:center;
    box-shadow:var(--shadow-lg);
    animation:fadeSlideUp 640ms var(--ease) both;
  }
  #loginScreen .lockmark{
    width:46px; height:46px; border-radius:13px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
    color:#fff; font-size:19px; box-shadow:var(--shadow-md);
  }
  #loginScreen h2{
    margin:0 0 8px; font-size:1.85rem; font-weight:700; letter-spacing:-0.025em; color:var(--text);
  }
  #loginScreen p.lead{
    color:var(--text-secondary); font-size:.93rem; margin:0 0 30px; font-weight:500;
    letter-spacing:-0.005em;
  }
  #loginScreen .field{
    text-align:left; margin-bottom:14px;
  }
  #loginScreen label{
    display:block; font-size:.74rem; font-weight:600; color:var(--text-secondary);
    margin-bottom:6px; letter-spacing:0.01em;
  }
  #loginScreen input{
    width:100%; padding:12.5px 14px; border:1px solid var(--border);
    border-radius:var(--radius-sm); font-size:.93rem; font-family:var(--sans);
    background:rgba(255,255,255,0.6); color:var(--text);
    transition:border-color 200ms var(--ease), box-shadow 200ms var(--ease), background 200ms var(--ease);
    outline:none;
  }
  #loginScreen input:focus{
    border-color:var(--accent); background:#fff;
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  #loginScreen button{
    width:100%; padding:13.5px; background:var(--accent); color:#fff; border:none;
    border-radius:var(--radius-sm); font-weight:700; font-size:.92rem; cursor:pointer;
    margin-top:12px; font-family:var(--sans); letter-spacing:-0.005em;
    transition:transform 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
    box-shadow:var(--shadow-sm);
  }
  #loginScreen button:hover{ background:#0B1220; box-shadow:var(--shadow-md); transform:translateY(-1px); }
  #loginScreen button:active{ transform:translateY(0); }
  #loginError{
    color:var(--error); font-size:.82rem; margin-top:16px; display:none; font-weight:500;
  }

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(14px) scale(.985); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* =========================================================
     Dashboard
  ========================================================= */
  #dashboardScreen{
    position:relative; z-index:1;
    display:none; max-width:1180px; margin:0 auto; padding:56px 32px 80px;
  }
  .hero{
    margin-bottom:44px;
    animation:fadeSlideUp 560ms var(--ease) both;
  }
  .hero .eyebrow{
    color:var(--text-secondary); font-size:.82rem; font-weight:600; letter-spacing:0.02em;
    margin:0 0 10px;
  }
  #dashboardScreen h1{
    margin:0 0 10px; font-size:2.6rem; font-weight:700; letter-spacing:-0.03em; color:var(--text);
    line-height:1.1;
  }
  #dashboardScreen .sub{
    color:var(--text-secondary); margin:0; font-size:1.02rem; font-weight:500; letter-spacing:-0.005em;
  }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:20px;
  }
  .card{
    position:relative;
    background:var(--card);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:30px 28px;
    box-shadow:var(--shadow-sm);
    transition:transform 260ms var(--ease), box-shadow 260ms var(--ease), border-color 260ms var(--ease);
    animation:fadeSlideUp 560ms var(--ease) both;
    overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:var(--radius-lg);
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), rgba(15,23,42,0.05), transparent 60%);
    opacity:0; transition:opacity 300ms var(--ease); pointer-events:none;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow-lg);
    border-color:rgba(15,23,42,0.14);
  }
  .card:hover::before{ opacity:1; }
  .card .icon{
    width:52px; height:52px; border-radius:var(--radius-sm); background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:20px;
    transition:transform 260ms var(--ease);
  }
  .card:hover .icon{ transform:scale(1.06); }
  .card h3{
    margin:0 0 6px; font-size:1.08rem; font-weight:700; letter-spacing:-0.015em; color:var(--text);
  }
  .card p{
    margin:0 0 22px; color:var(--text-secondary); font-size:.86rem; font-weight:500;
    line-height:1.5; letter-spacing:-0.003em;
  }
  .card a{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px; border-radius:var(--radius-sm); color:#fff; background:var(--accent);
    font-weight:600; font-size:.85rem; text-decoration:none; font-family:var(--sans);
    transition:background 200ms var(--ease), transform 200ms var(--ease);
  }
  .card a:hover{ background:#0B1220; transform:translateY(-1px); }

  #noAccess{
    color:var(--text-secondary); font-size:.92rem; display:none; text-align:center;
    padding:60px 20px; font-weight:500;
  }

  /* stagger card entrance slightly */
  .card:nth-child(1){ animation-delay:20ms; }
  .card:nth-child(2){ animation-delay:60ms; }
  .card:nth-child(3){ animation-delay:100ms; }
  .card:nth-child(4){ animation-delay:140ms; }
  .card:nth-child(5){ animation-delay:180ms; }
  .card:nth-child(6){ animation-delay:220ms; }
  .card:nth-child(7){ animation-delay:260ms; }

  @media (max-width:680px){
    header{ padding:14px 18px; }
    header nav{ gap:18px; }
    #dashboardScreen{ padding:36px 18px 60px; }
    #dashboardScreen h1{ font-size:1.9rem; }
    .card-grid{ grid-template-columns:1fr; gap:14px; }
    .card{ padding:26px 22px; }
    #loginScreen .card{ padding:36px 26px 30px; }
  }
</style>
</head>
<body>

<div class="ambient"><span class="a"></span><span class="b"></span></div>

<header>
  <div class="brand">
    <span class="mark">CN</span>
    <span>Challenge Naylor</span>
  </div>
  <nav id="navLinks"></nav>
  <button id="hamburgerBtn" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <button id="logoutBtn">Log out</button>
</header>
<div id="navBackdrop"></div>
<div id="mobileNavPanel"></div>

<div id="loginScreen">
  <div class="card">
    <div class="lockmark">🔒</div>
    <h2>Welcome back</h2>
    <p class="lead">Sign in to access your workspace.</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@challengenaylor.com">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button id="loginBtn">Sign in</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="dashboardScreen">
  <div class="hero">
    <p class="eyebrow" id="heroEyebrow">WORKSPACE</p>
    <h1 id="heroGreeting">Welcome back</h1>
    <p class="sub">Everything you have access to, in one place.</p>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <p id="noAccess">You don't have access to any tools yet. Contact your admin.</p>
</div>

<!-- ===================================================================
     FIREBASE — same project as your other tools, plus Authentication
     for login, and Firestore for who's allowed to see what.
     (Unchanged from the previous version — visual redesign only.)
     =================================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAPwS1GFwqj6KR4dQgxifykh9HS5km6OX4",
    authDomain: "alpha-7fce5.firebaseapp.com",
    projectId: "alpha-7fce5",
    storageBucket: "alpha-7fce5.firebasestorage.app",
    messagingSenderId: "10647816245",
    appId: "1:10647816245:web:fbfb982260cf2eef97097c"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---------------------------------------------------------------
  // TOOL LIST — edit this array to add, remove, or relabel tools.
  // "key" must match an entry in each person's "tools" list in Firestore.
  // ---------------------------------------------------------------
  const TOOLS = [
    {
      key: "roster",
      name: "Weekly Roster",
      desc: "Manage staff shifts and schedules",
      icon: "👥",
      color: "#1F7A54",
      url: "/roster/"
    },
    {
      key: "cashflow",
      name: "Cashflow Dashboard",
      desc: "View bank statement analysis and GST estimates",
      icon: "📊",
      color: "#5847E8",
      url: "/dashboard/"
    },
    {
      key: "expenses",
      name: "Expense SmartCoder",
      desc: "Process and categorize invoice expenses",
      icon: "🧾",
      color: "#C6392E",
      url: "/expenses/"
    },
    {
      key: "payments",
      name: "20th Payments",
      desc: "Track monthly supplier payments",
      icon: "💳",
      color: "#B8862E",
      url: "/payments/"
    },
    {
      key: "kpi",
      name: "KPI Dashboard",
      desc: "Monthly KPI & P&L tracking",
      icon: "📈",
      color: "#2E7DB8",
      url: "/kpi/"
    },
    {
      key: "creditcard",
      name: "Credit Card SmartCoder",
      desc: "Process and categorize credit card statements",
      icon: "💳",
      color: "#8B4FD6",
      url: "/creditcard/"
    },
    {
      key: "fuel",
      name: "Fuel Reconciliation",
      desc: "Reconcile fuel purchases and usage",
      icon: "⛽",
      color: "#D67B2E",
      url: "/fuel/"
    },
    {
      key: "cashflowintelligence",
      name: "Cash Flow Intelligence",
      desc: "Bank statement analysis, forecasting, and cash flow tracking",
      icon: "💹",
      color: "#0E7C7B",
      url: "/cashflow-intelligence/"
    },
    {
      key: "visitor",
      name: "Visitor Sign-in",
      desc: "Sign visitors in and out",
      icon: "📝",
      color: "#3B82F6",
      url: "/visitor/"
    },
    {
      key: "tgp",
      name: "Terminal Gate Pricing",
      desc: "Daily supplier fuel pricing vs Challenge pricing",
      icon: "⛽",
      color: "#1F6FEB",
      url: "/tgp/frontend/index.html"
    }
  ];

  const loginScreen = document.getElementById('loginScreen');
  const dashboardScreen = document.getElementById('dashboardScreen');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginError.style.display = 'none';
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      loginError.textContent = "Incorrect email or password.";
      loginError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileNavPanelEl = document.getElementById('mobileNavPanel');
  const navBackdrop = document.getElementById('navBackdrop');
  function closeMobileNav(){
    mobileNavPanelEl.style.display = 'none';
    navBackdrop.style.display = 'none';
  }
  hamburgerBtn.addEventListener('click', () => {
    const isOpen = mobileNavPanelEl.style.display === 'block';
    if (isOpen) { closeMobileNav(); }
    else { mobileNavPanelEl.style.display = 'block'; navBackdrop.style.display = 'block'; }
  });
  navBackdrop.addEventListener('click', closeMobileNav);
  mobileNavPanelEl.addEventListener('click', (e) => { if (e.target.tagName === 'A') closeMobileNav(); });

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      loginScreen.style.display = 'flex';
      dashboardScreen.style.display = 'none';
      logoutBtn.style.display = 'none';
      return;
    }

    logoutBtn.style.display = 'inline-block';

    // Look up this person's allowed tools from Firestore.
    // Document path: users/{their uid}  ->  { role: "admin", tools: ["roster","cashflow","expenses"] }
    let allowed = [];
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      if (snap.exists) {
        const data = snap.data();
        allowed = data.role === 'admin' ? TOOLS.map(t => t.key) : (data.tools || []);
      }
    } catch (e) {
      console.error("Could not load access list.", e);
    }

    const grid = document.getElementById('cardGrid');
    const navLinks = document.getElementById('navLinks');
    const mobileNavPanel = document.getElementById('mobileNavPanel');
    const noAccess = document.getElementById('noAccess');
    grid.innerHTML = '';
    navLinks.innerHTML = '';
    mobileNavPanel.innerHTML = '';
    const visibleTools = TOOLS.filter(t => allowed.includes(t.key));

    visibleTools.forEach(t => {
      const a = document.createElement('a');
      a.href = t.url;
      a.textContent = t.name;
      navLinks.appendChild(a);

      const m = document.createElement('a');
      m.href = t.url;
      m.textContent = t.name;
      mobileNavPanel.appendChild(m);
    });

    if (!visibleTools.length) {
      noAccess.style.display = 'block';
    } else {
      noAccess.style.display = 'none';
      visibleTools.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="icon" style="background:' + t.color + '1A; color:' + t.color + ';">' + t.icon + '</div>' +
          '<h3>' + t.name + '</h3>' +
          '<p>' + t.desc + '</p>' +
          '<a href="' + t.url + '">Open →</a>';
        grid.appendChild(card);
      });
    }

    loginScreen.style.display = 'none';
    dashboardScreen.style.display = 'block';
  });
</script>

<!-- ===================================================================
     Presentation-only additions below — do not affect auth/data logic.
     Time-based greeting text and a subtle cursor-glow on cards.
     =================================================================== -->
<script>
  (function(){
    const hourNow = new Date().getHours();
    const greeting = hourNow < 12 ? "Good morning" : hourNow < 18 ? "Good afternoon" : "Good evening";
    const el = document.getElementById('heroGreeting');
    if (el) el.textContent = greeting;
  })();

  document.addEventListener('mousemove', (e) => {
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
      }
    });
  });
</script>
</body>
</html>
