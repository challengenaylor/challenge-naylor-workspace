<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fuel Reconciliation Suite</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  /* =========================================================
     DESIGN TOKENS
     Every variable name below is referenced directly inside
     the app's JavaScript (inline styles + toast/status colors),
     so names are preserved exactly — only values change.
  ========================================================= */
  :root {
    --bg: #0A0B0D; --card: #111318; --card-raised: #171A20;
    --border: #23272E; --border-soft: #1B1E24;
    --text: #F5F6F7; --text-dim: #C7CBD1; --text-muted: #8B909A;
    --accent: #3B82F6; --accent-soft: rgba(59,130,246,0.16); --accent-strong: #60A5FA;
    --success: #34D399; --success-bg: rgba(52,211,153,0.14);
    --danger: #F87171; --danger-bg: rgba(248,113,113,0.14);
    --warning: #FBBF24; --warning-bg: rgba(251,191,36,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.45);
    --shadow-hover: 0 4px 10px rgba(0,0,0,0.4), 0 24px 56px rgba(0,0,0,0.5);
    --sidebar-w: 248px; --sidebar-w-collapsed: 72px; --header-h: 64px; --footer-h: 36px;
    --radius: 20px; --radius-lg: 24px; --radius-sm: 12px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.light {
    --bg: #FFFFFF; --card: #FFFFFF; --card-raised: #F9FAFB;
    --border: #E5E7EB; --border-soft: #F1F2F4;
    --text: #111827; --text-dim: #374151; --text-muted: #6B7280;
    --accent: #2563EB; --accent-soft: rgba(37,99,235,0.08); --accent-strong: #1D4ED8;
    --success: #10B981; --success-bg: rgba(16,185,129,0.10);
    --danger: #EF4444; --danger-bg: rgba(239,68,68,0.10);
    --warning: #F59E0B; --warning-bg: rgba(245,158,11,0.10);
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 12px 28px rgba(16,24,40,0.06);
    --shadow-hover: 0 2px 4px rgba(16,24,40,0.05), 0 20px 44px rgba(16,24,40,0.09);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .display { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  button, input { font-family: inherit; }
  h1, h2, h3, .display { font-weight: 700; letter-spacing: -0.015em; }

  /* ---------- Shell layout ---------- */
  #shell { display: flex; height: 100vh; }
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: width 0.25s var(--ease); overflow: hidden;
  }
  #sidebar.collapsed { width: var(--sidebar-w-collapsed); }
  .sb-brand { display: flex; align-items: center; gap: 12px; padding: 16px; height: var(--header-h); border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
  .sb-brand .mark { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent); }
  .sb-brand .name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; letter-spacing: -0.01em; }
  #sidebar.collapsed .sb-brand .name, #sidebar.collapsed .nav-label { display: none; }
  .nav-scroll { flex: 1; overflow-y: auto; padding: 16px 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-muted);
    cursor: pointer; font-size: 13.5px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; user-select: none;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .nav-item svg { flex-shrink: 0; }
  .nav-item:hover { background: var(--card-raised); color: var(--text); transform: translateX(1px); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .sb-footer { padding: 12px; border-top: 1px solid var(--border-soft); flex-shrink: 0; }

  #main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #app-header {
    height: var(--header-h); flex-shrink: 0; display: flex; align-items: center; gap: 14px;
    padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--card);
    backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  }
  #app-content { flex: 1; overflow-y: auto; padding: 32px 32px 40px; }
  #status-bar {
    height: var(--footer-h); flex-shrink: 0; display: flex; align-items: center; gap: 20px;
    padding: 0 20px; border-top: 1px solid var(--border); background: var(--card); font-size: 11.5px; color: var(--text-muted);
  }
  #status-bar .sep { width: 1px; height: 12px; background: var(--border); }

  .icon-btn {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer;
    transition: all 0.18s var(--ease);
  }
  .icon-btn:hover { background: var(--card-raised); color: var(--text); border-color: var(--border); transform: translateY(-1px); }

  .breadcrumb { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .breadcrumb b { color: var(--text); font-weight: 700; }
  .header-search {
    display: flex; align-items: center; gap: 9px; background: var(--card-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text-muted); font-size: 13px; cursor: pointer; width: 240px;
    transition: all 0.18s var(--ease);
  }
  .header-search:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .kbd { border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; font-size: 10px; color: var(--text-muted); margin-left: auto; font-weight: 600; }

  /* ---------- Cards / KPIs ---------- */
  .panel {
    background: var(--card) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important;
    box-shadow: var(--shadow) !important; padding: 24px !important;
    transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease), border-color 0.25s var(--ease);
  }
  .panel:hover { box-shadow: var(--shadow-hover) !important; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px !important; margin-bottom: 24px !important; }
  .kpi-card { padding: 22px !important; cursor: default; }
  .kpi-card:hover { transform: translateY(-3px); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px !important; }
  .kpi-icon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .kpi-value { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 5px !important; font-weight: 500; }
  .trend { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; }
  .trend.up { color: var(--success); background: var(--success-bg); }
  .trend.down { color: var(--danger); background: var(--danger-bg); }
  .trend.flat { color: var(--text-muted); background: var(--card-raised); }

  .section-title { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 16px !important; }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px !important; margin-bottom: 24px !important; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .tank-row { margin-bottom: 16px !important; }
  .tank-row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px !important; font-weight: 500; }
  .tank-bar-track { height: 8px; border-radius: 999px; background: var(--card-raised); overflow: hidden; }
  .tank-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s var(--ease); }

  .activity-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0 !important; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 0 3px currentColor; opacity: 0.9; }
  .activity-time { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* ---------- Data grid ---------- */
  .grid-toolbar { display: flex; align-items: center; gap: 12px !important; margin-bottom: 20px !important; flex-wrap: wrap; }
  .segmented { display: flex; background: var(--card-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; }
  .segmented button { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 9px; cursor: pointer; transition: all 0.18s var(--ease); }
  .segmented button.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-soft); }

  table.datagrid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  table.datagrid th {
    position: sticky; top: 0; background: var(--card-raised); color: var(--text-muted); text-align: left;
    font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 14px !important;
    border-bottom: 1px solid var(--border); z-index: 1;
  }
  table.datagrid td { padding: 10px 14px !important; border-bottom: 1px solid var(--border-soft); transition: background-color 0.15s var(--ease); }
  table.datagrid tbody tr:nth-child(even) td { background: var(--card-raised); }
  table.datagrid tr:hover td { background: var(--accent-soft) !important; }
  table.datagrid th:first-child, table.datagrid td:first-child {
    position: sticky; left: 0; background: var(--card); z-index: 2; font-weight: 600;
  }
  table.datagrid th:first-child { z-index: 3; background: var(--card-raised); }
  table.datagrid tbody tr:nth-child(even) td:first-child { background: var(--card-raised); }

  .cell-input {
    width: 100%; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 8px 10px !important; font-size: 13.5px;
    color: var(--text); font-family: inherit; outline: none; background: transparent; transition: all 0.15s var(--ease);
  }
  .cell-input:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cell-readonly { background: var(--card-raised) !important; color: var(--text-muted); border-radius: var(--radius-sm); }
  .cell-editable { background: transparent; }
  .cell-calculated { background: var(--accent-soft) !important; color: var(--accent-strong) !important; font-weight: 700 !important; border-radius: var(--radius-sm); }
  .cell-error { background: var(--danger-bg) !important; color: var(--danger) !important; border-radius: var(--radius-sm); }
  .status-pill { font-size: 10.5px; padding: 3px 9px !important; border-radius: 999px; font-weight: 700; letter-spacing: 0.02em; }
  .status-pill.ok { color: var(--success); background: var(--success-bg); }
  .status-pill.check { color: var(--danger); background: var(--danger-bg); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-sm) !important; padding: 10px 18px !important;
    font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    transition: all 0.18s var(--ease);
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 4px 12px var(--accent-soft); }
  .btn-primary:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-soft); }
  .btn-secondary { background: var(--card); border-color: var(--border) !important; color: var(--text); }
  .btn-secondary:hover { background: var(--card-raised); transform: translateY(-1px); border-color: var(--text-muted) !important; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-danger:hover { transform: translateY(-1px); filter: brightness(0.97); }
  .btn-success { background: var(--success-bg); color: var(--success); }
  .btn-success:hover { transform: translateY(-1px); filter: brightness(0.97); }
  .btn:active { transform: translateY(0) scale(0.98); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px !important; margin-bottom: 16px !important; }
  .field-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 7px !important; font-weight: 500; }
  .textbox, .numbox {
    width: 100%; background: var(--card-raised); border: 1px solid var(--border); border-radius: var(--radius-sm) !important;
    padding: 9px 12px !important; color: var(--text); font-size: 13.5px; outline: none; transition: all 0.15s var(--ease);
  }
  .textbox:focus, .numbox:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
  .placeholder-box { background: var(--card-raised); border: 1.5px dashed var(--border); border-radius: var(--radius-sm); padding: 14px !important; font-size: 12.5px; color: var(--text-muted); }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 20px !important; color: var(--text-muted); text-align: center; }
  .empty-state .icon-wrap { width: 58px; height: 58px; border-radius: var(--radius); background: var(--card-raised); display: flex; align-items: center; justify-content: center; margin-bottom: 20px !important; color: var(--text-muted); }

  .toast-wrap { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-hover); border-radius: var(--radius-sm);
    padding: 12px 16px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 9px; min-width: 240px;
    animation: toastin 0.25s var(--ease);
  }
  @keyframes toastin { from { opacity:0; transform: translateY(-8px) scale(0.98);} to {opacity:1; transform: translateY(0) scale(1);} }

  /* ---------- Command palette ---------- */
  #paletteOverlay {
    position: fixed; inset: 0; background: rgba(10,11,13,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 300; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh;
  }
  #paletteOverlay.open { display: flex; }
  #paletteBox { width: 580px; max-width: 92vw; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-hover); overflow: hidden; }
  #paletteInput { width: 100%; border: none; background: transparent; padding: 20px 22px; font-size: 15.5px; color: var(--text); outline: none; border-bottom: 1px solid var(--border-soft); font-weight: 500; }
  #paletteList { max-height: 340px; overflow-y: auto; padding: 8px; }
  .palette-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; color: var(--text-dim); font-weight: 500; transition: background-color 0.12s var(--ease); }
  .palette-item.sel { background: var(--accent-soft); color: var(--accent-strong); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  @media (max-width: 860px) {
    #app-content { padding: 20px 16px 28px; }
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    #sidebar { position: fixed; z-index: 60; height: 100vh; }
  }
  @media print {
    #sidebar, #app-header, #status-bar, .toast-wrap, #paletteOverlay { display: none !important; }
    #app-content { padding: 0; overflow: visible; }
    body { overflow: visible; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar"></div>
  <div id="main-col">
    <div id="app-header"></div>
    <div id="app-content"></div>
    <div id="status-bar"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="paletteOverlay">
  <div id="paletteBox">
    <input id="paletteInput" placeholder="Search pages, reports, actions…"/>
    <div id="paletteList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAPwS1GFwqj6KR4dQgxifykh9HS5km6OX4",
  authDomain: "alpha-7fce5.firebaseapp.com",
  projectId: "alpha-7fce5",
  storageBucket: "alpha-7fce5.firebasestorage.app",
  messagingSenderId: "10647816245",
  appId: "1:10647816245:web:fbfb982260cf2eef97097c"
};
const fuelFbApp = initializeApp(firebaseConfig, "fuelReconciliationApp");
const fuelDb = getFirestore(fuelFbApp);
const fuelDocRef = doc(fuelDb, "fuelApp", "main");

/* =================================================================
   CONSTANTS
================================================================= */
const DAYS_IN_MONTH = 31;
const DEFAULT_FUELS = [
  { key: "p95", name: "Premium 95", meters: 6, tanks: 2, capacityLitres: null, pumpLabels: null, code: "95", deadStockLitres: 1000, safetyDays: 2 },
  { key: "r91", name: "Regular 91", meters: 6, tanks: 2, capacityLitres: null, pumpLabels: null, code: "91", deadStockLitres: 1000, safetyDays: 2 },
  { key: "ago", name: "Diesel", meters: 6, tanks: 2, capacityLitres: null, pumpLabels: null, code: "D", deadStockLitres: 1000, safetyDays: 2 },
];
const APP_VERSION = "1.0.0";

function emptyDayFuel(numMeters, numTanks) {
  return {
    meters: Array(numMeters).fill(""), tanks: Array(numTanks).fill(""),
    deliveries: "", meterTest: "",
    openingMeters: Array(numMeters).fill(""), openingTanks: Array(numTanks).fill(""),
  };
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function hasAny(arr) { return (arr || []).some(v => v !== "" && v !== null && v !== undefined); }
function sumArr(arr) { return (arr || []).reduce((s, v) => s + num(v), 0); }
function fmt(n, dp) { dp = dp||0; if (n===null||n===undefined||isNaN(n)) return "—"; return n.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtSigned(n, dp) { if (n===null||n===undefined||isNaN(n)) return "—"; return (n>=0?"+":"")+fmt(n,dp); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pumpLabel(fuel, i) { return (fuel.pumpLabels && fuel.pumpLabels[i]) ? String(fuel.pumpLabels[i]) : String(i+1); }
function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  if (s < 86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

/* =================================================================
   CALCULATION ENGINE — unchanged from prior version
================================================================= */
function computeDay(fuelKey, dayNum, days, config) {
  const fuelCfg = config.fuels.find(f => f.key === fuelKey);
  const d = (days[dayNum] && days[dayNum][fuelKey]) || emptyDayFuel(fuelCfg.meters, fuelCfg.tanks);
  let prevMeterClosing = null, prevTankClosing = null;
  for (let p = dayNum - 1; p >= 1; p--) {
    const pd = days[p] && days[p][fuelKey];
    if (pd && hasAny(pd.meters)) { prevMeterClosing = sumArr(pd.meters); break; }
  }
  for (let p = dayNum - 1; p >= 1; p--) {
    const pd = days[p] && days[p][fuelKey];
    if (pd && hasAny(pd.tanks)) { prevTankClosing = sumArr(pd.tanks); break; }
  }
  const meterOpening = prevMeterClosing !== null ? prevMeterClosing : sumArr(d.openingMeters);
  const tankOpening = prevTankClosing !== null ? prevTankClosing : sumArr(d.openingTanks);
  const meterClosing = sumArr(d.meters);
  const tankClosing = sumArr(d.tanks);
  const deliveries = num(d.deliveries);
  const meterTest = num(d.meterTest);
  const enteredMeters = hasAny(d.meters);
  const enteredTanks = hasAny(d.tanks);
  const meterError = meterOpening > meterClosing && enteredMeters;
  const meterSales = enteredMeters ? meterClosing - meterOpening : null;
  const tankStock = tankOpening + deliveries + meterTest;
  const tankSales = enteredTanks ? tankStock - tankClosing : null;
  const gainLoss = (meterSales !== null && tankSales !== null) ? meterSales - tankSales : null;
  return { meterOpening, meterClosing, meterSales, meterError, tankOpening, tankClosing, tankStock, tankSales,
    deliveries, meterTest, gainLoss, entered: enteredMeters || enteredTanks,
    usedOverrideMeter: prevMeterClosing === null, usedOverrideTank: prevTankClosing === null };
}
function computeMonthSummary(fuelKey, days, config, tolerancePct) {
  let totalDeliveries=0, totalMeterTest=0, lastMeterClosing=null, lastTankClosing=null, lastDayNum=null, firstDayNum=null;
  for (let n=1;n<=DAYS_IN_MONTH;n++) {
    const c = computeDay(fuelKey, n, days, config);
    if (c.entered) { if (firstDayNum===null) firstDayNum=n; lastDayNum=n; }
    if (hasAny(days[n] && days[n][fuelKey] && days[n][fuelKey].tanks)) lastTankClosing = c.tankClosing;
    if (hasAny(days[n] && days[n][fuelKey] && days[n][fuelKey].meters)) lastMeterClosing = c.meterClosing;
    totalDeliveries += c.deliveries; totalMeterTest += c.meterTest;
  }
  const firstDayCalc = firstDayNum ? computeDay(fuelKey, firstDayNum, days, config) : null;
  const openingDip = firstDayCalc ? firstDayCalc.tankOpening : 0;
  const openingMeter = firstDayCalc ? firstDayCalc.meterOpening : 0;
  const closingDip = lastTankClosing !== null ? lastTankClosing : openingDip;
  const closingMeter = lastMeterClosing !== null ? lastMeterClosing : openingMeter;
  const tankThroughput = openingDip + totalDeliveries - closingDip;
  const meterThroughput = closingMeter - openingMeter - totalMeterTest;
  const monthGainLoss = meterThroughput - tankThroughput;
  const pctOfThroughput = meterThroughput !== 0 ? monthGainLoss / meterThroughput : 0;
  const alert = Math.abs(pctOfThroughput)*100 > tolerancePct;
  return { openingDip, totalDeliveries, closingDip, tankThroughput, openingMeter, totalMeterTest, closingMeter,
    meterThroughput, monthGainLoss, pctOfThroughput, alert, lastDayNum, firstDayNum };
}
function computePumpStats(fuelKey, config, days) {
  const fuelCfg = config.fuels.find(f => f.key === fuelKey);
  const stats = [];
  for (let i=0;i<fuelCfg.meters;i++) {
    let prevClosing=null, total=0, count=0;
    for (let n=1;n<=DAYS_IN_MONTH;n++) {
      const raw = days[n] && days[n][fuelKey] && days[n][fuelKey].meters && days[n][fuelKey].meters[i];
      if (raw===""||raw===undefined||raw===null) continue;
      const val = num(raw);
      if (prevClosing!==null) { const sales = val-prevClosing; if (sales>=0) { total+=sales; count+=1; } }
      prevClosing = val;
    }
    stats.push({ index:i, total, avg: count>0?total/count:0, daysCounted:count });
  }
  const maxAvg = Math.max(1, ...stats.map(s=>s.avg));
  const ranked = [...stats].sort((a,b)=>b.avg-a.avg);
  return { stats, ranked, maxAvg };
}

const usingClaudeStorage = (typeof window.storage !== "undefined");
const storageAdapter = usingClaudeStorage ? {
  async get(key, shared) { try { const r = await window.storage.get(key, shared); return r?r.value:null; } catch(e){ return null; } },
  async set(key, value, shared) { try { await window.storage.set(key, value, shared); return true; } catch(e){ return false; } },
} : {
  // Real shared storage — every device reading/writing this same
  // Firestore document (fuelApp/main) stays in sync.
  async get(key) {
    try {
      const snap = await getDoc(fuelDocRef);
      if (!snap.exists()) return null;
      const data = snap.data();
      return (key in data) ? data[key] : null;
    } catch (e) { console.error("Firestore get failed:", e); return null; }
  },
  async set(key, value) {
    try {
      await setDoc(fuelDocRef, { [key]: value }, { merge: true });
      return true;
    } catch (e) { console.error("Firestore set failed:", e); return false; }
  },
};

function lastEnteredDay(fuelKey) {
  for (let n = DAYS_IN_MONTH; n >= 1; n--) {
    if (hasAny(state.days[n] && state.days[n][fuelKey] && state.days[n][fuelKey].meters)) return n;
  }
  return null;
}
function computeStockAlert(fuelKey) {
  const fuel = state.config.fuels.find(f => f.key === fuelKey);
  const ld = lastEnteredDay(fuelKey);
  const currentStock = ld ? computeDay(fuelKey, ld, state.days, state.config).tankClosing : null;
  const s = computeMonthSummary(fuelKey, state.days, state.config, state.config.tolerancePct || 0.4);
  const daysSpan = (s.lastDayNum && s.firstDayNum) ? (s.lastDayNum - s.firstDayNum + 1) : 0;
  const avgDailySales = daysSpan > 0 ? (s.meterThroughput / daysSpan) : 0;
  const deadStock = (fuel.deadStockLitres===undefined || fuel.deadStockLitres===null) ? 1000 : fuel.deadStockLitres;
  const safetyDays = (fuel.safetyDays===undefined || fuel.safetyDays===null) ? 2 : fuel.safetyDays;
  let daysUntilDead = null;
  if (avgDailySales > 0 && currentStock !== null) daysUntilDead = (currentStock - deadStock) / avgDailySales;
  let level = 'none';
  if (daysUntilDead !== null) {
    if (daysUntilDead <= safetyDays) level = 'critical';
    else if (daysUntilDead <= safetyDays + 1) level = 'watch';
  }
  return { currentStock, avgDailySales, deadStock, safetyDays, daysUntilDead, level };
}
function anyStockAlert() {
  return state.config.fuels.some(f => computeStockAlert(f.key).level !== 'none');
}
function trendHTML(curr, prev) {
  if (prev === null || prev === undefined || curr === null) return `<span class="trend flat">${iconSVG('arrowflat',11)} —</span>`;
  const diff = curr - prev;
  if (Math.abs(diff) < 0.01) return `<span class="trend flat">${iconSVG('arrowflat',11)} flat</span>`;
  const cls = diff > 0 ? "up" : "down";
  const pct = prev !== 0 ? Math.abs(diff/prev*100) : 0;
  return `<span class="trend ${cls}">${iconSVG(diff>0?'arrowup':'arrowdown',11)} ${fmt(pct,1)}%</span>`;
}

function renderDashboard() {
  const tol = state.config.tolerancePct || 0.4;
  let todaySales=0, todayDeliveries=0, currentStock=0, monthGainLoss=0, monthThroughput=0, totalAvgDaily=0, avgCount=0;
  let prevSales=0;
  state.config.fuels.forEach(f => {
    const ld = lastEnteredDay(f.key);
    if (ld) {
      const c = computeDay(f.key, ld, state.days, state.config);
      todaySales += c.meterSales || 0;
      todayDeliveries += c.deliveries || 0;
      currentStock += c.tankClosing || 0;
      if (ld > 1) {
        const p = computeDay(f.key, ld-1, state.days, state.config);
        prevSales += p.meterSales || 0;
      }
    }
    const s = computeMonthSummary(f.key, state.days, state.config, tol);
    monthGainLoss += s.monthGainLoss;
    monthThroughput += s.meterThroughput;
    const daysSpan = (s.lastDayNum && s.firstDayNum) ? (s.lastDayNum - s.firstDayNum + 1) : 0;
    if (daysSpan > 0) { totalAvgDaily += s.meterThroughput / daysSpan; avgCount++; }
  });
  const avgDaily = avgCount > 0 ? totalAvgDaily : 0;

  const kpis = [
    { label: "Today's Sales", value: fmt(todaySales)+" L", sub: "Most recent day entered", icon: "drop", trend: trendHTML(todaySales, prevSales) },
    { label: "Today's Deliveries", value: fmt(todayDeliveries)+" L", sub: "Most recent day entered", icon: "truck", trend: "" },
    { label: "Current Tank Stock", value: fmt(currentStock)+" L", sub: "Sum of latest dips", icon: "box", trend: "" },
    { label: "Current Gain/Loss", value: fmtSigned(monthGainLoss)+" L", sub: "Month to date, all grades", icon: "gauge", trend: "" },
    { label: "Average Daily Sales", value: fmt(avgDaily)+" L", sub: "Per fuel, month to date", icon: "barchart", trend: "" },
    { label: "Monthly Throughput", value: fmt(monthThroughput)+" L", sub: state.config.monthLabel, icon: "dashboard", trend: "" },
  ];

  const kpiHTML = kpis.map(k => `
    <div class="panel kpi-card">
      <div class="kpi-top"><div class="kpi-icon">${iconSVG(k.icon,16)}</div>${k.trend}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.label} · ${k.sub}</div>
    </div>`).join("");

  // trend chart (all fuels combined gain/loss)
  const chartW=620, chartH=180, padL=30, padR=10, padT=10, padB=18;
  let allVals = [];
  const series = state.config.fuels.map(f => {
    const pts = [];
    for (let n=1;n<=DAYS_IN_MONTH;n++) { const c = computeDay(f.key,n,state.days,state.config); pts.push(c.entered?c.gainLoss:null); }
    allVals = allVals.concat(pts.filter(v=>v!==null));
    return pts;
  });
  const maxAbs = Math.max(10, ...allVals.map(v=>Math.abs(v)));
  const yFor = v => chartH-padB-((v+maxAbs)/(2*maxAbs))*(chartH-padT-padB);
  const xFor = n => padL+((n-1)/(DAYS_IN_MONTH-1))*(chartW-padL-padR);
  const colors = ["var(--accent)","#8C6BAE","#3FAE68"];
  const pathsHTML = series.map((pts,i) => {
    let d=""; let started=false;
    pts.forEach((v,idx) => { if (v===null) return; const x=xFor(idx+1), y=yFor(v); d += (started?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1); started=true; });
    return `<path d="${d}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");

  // tank status bars
  const tankBarsHTML = state.config.fuels.map(f => {
    const ld = lastEnteredDay(f.key);
    const level = ld ? computeDay(f.key, ld, state.days, state.config).tankClosing : 0;
    const cap = f.capacityLitres;
    let pct = null, color = "var(--text-muted)";
    if (cap && cap > 0) {
      pct = Math.max(0, Math.min(100, (level/cap)*100));
      color = pct > 40 ? "var(--success)" : pct > 15 ? "var(--warning)" : "var(--danger)";
    }
    return `
      <div class="tank-row">
        <div class="tank-row-top"><span>${esc(f.name)}</span><span style="color:var(--text-muted);">${cap?fmt(level)+' / '+fmt(cap)+' L':fmt(level)+' L · set capacity in Settings'}</span></div>
        <div class="tank-bar-track"><div class="tank-bar-fill" style="width:${pct!==null?pct:100}%;background:${cap?color:'var(--border)'};"></div></div>
      </div>`;
  }).join("");

  const activityHTML = state.activity.length ? state.activity.slice(0,8).map(a => {
    const color = a.type === "variance" ? "var(--danger)" : a.type === "backup" ? "var(--accent)" : "var(--success)";
    return `<div class="activity-item"><div class="activity-dot" style="background:${color};"></div>
      <div><div>${esc(a.message)}</div><div class="activity-time">${timeAgo(a.ts)}</div></div></div>`;
  }).join("") : `<div style="color:var(--text-muted);font-size:12.5px;padding:8px 0;">No activity recorded yet — start entering today's readings.</div>`;

  return `
    <div class="kpi-grid">${kpiHTML}</div>
    <div class="grid-2">
      <div class="panel" style="padding:18px;">
        <div class="section-title">Monthly gain / loss trend</div>
        <svg viewBox="0 0 ${chartW} ${chartH}" style="width:100%;height:auto;">
          <line x1="${padL}" y1="${yFor(0)}" x2="${chartW-padR}" y2="${yFor(0)}" stroke="var(--border)" stroke-width="1"/>
          ${pathsHTML}
        </svg>
      </div>
      <div class="panel" style="padding:18px;">
        <div class="section-title">Tank status</div>
        ${tankBarsHTML}
      </div>
    </div>
    ${(() => {
      const alerts = state.config.fuels.map(f => ({ fuel: f, a: computeStockAlert(f.key) })).filter(x => x.a.level !== 'none');
      if (!alerts.length) return '';
      return `<div class="panel" style="padding:18px;margin-bottom:24px;">
        <div class="section-title">Stock alerts</div>
        ${alerts.map(({fuel, a}) => `
          <div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px;">
            <span style="width:15px;height:15px;color:${a.level==='critical'?'var(--danger)':'var(--warning)'};flex-shrink:0;">${iconSVG('alert',15)}</span>
            <div><b>${esc(fuel.name)}</b> — ${a.level==='critical'?'need delivery now':'delivery due soon'}, ~${fmt(Math.max(0,a.daysUntilDead),1)} days of sellable stock left</div>
          </div>`).join("")}
      </div>`;
    })()}
    <div class="grid-2">
      <div class="panel" style="padding:18px;">
        <div class="section-title">Recent activity</div>
        ${activityHTML}
      </div>
      <div class="panel" style="padding:18px;">
        <div class="section-title">This month at a glance</div>
        <div class="mini-row" style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>Fuel grades tracked</span><b>${state.config.fuels.length}</b></div>
        <div class="mini-row" style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>Tolerance threshold</span><b>±${esc(state.config.tolerancePct)}%</b></div>
        <div class="mini-row" style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>Grades over tolerance</span><b style="color:${anyAlert()?'var(--danger)':'var(--success)'};">${state.config.fuels.filter(f=>computeMonthSummary(f.key,state.days,state.config,tol).alert).length}</b></div>
      </div>
    </div>
  `;
}

/* =================================================================
   PAGE: DAILY ENTRY (spreadsheet-style grid)
================================================================= */
function formatOnBlur(input) {
  const v = parseFloat(input.value);
  if (!isNaN(v)) input.value = v.toLocaleString();
}
function unformatOnFocus(input, raw) {
  input.value = raw === "" || raw === undefined || raw === null ? "" : String(raw);
}

function renderEntryPage() {
  const fuel = state.config.fuels.find(f => f.key === state.entryFuel) || state.config.fuels[0];
  const dayNum = state.activeDay;
  const dayData = (state.days[dayNum] && state.days[dayNum][fuel.key]) || emptyDayFuel(fuel.meters, fuel.tanks);
  const calc = computeDay(fuel.key, dayNum, state.days, state.config);

  const fuelTabsHTML = state.config.fuels.map(f => `<button class="${f.key===fuel.key?'active':''}" data-fuel="${f.key}">${esc(f.name)}</button>`).join("");

  const dayButtons = Array.from({length: DAYS_IN_MONTH}).map((_,i) => {
    const n = i+1;
    const filled = hasAny(state.days[n] && state.days[n][fuel.key] && state.days[n][fuel.key].meters);
    return `<button class="icon-btn" data-day="${n}" style="width:30px;height:30px;border-radius:6px;font-size:11.5px;${n===dayNum?'background:var(--accent);color:#fff;':filled?'background:var(--card-raised);color:var(--text);':''}">${n}</button>`;
  }).join("");

  // pump table rows
  const pumpRows = Array.from({length: fuel.meters}).map((_, i) => {
    let prevVal = null;
    for (let p = dayNum-1; p>=1; p--) {
      const pv = state.days[p] && state.days[p][fuel.key] && state.days[p][fuel.key].meters && state.days[p][fuel.key].meters[i];
      if (pv !== "" && pv !== undefined && pv !== null) { prevVal = num(pv); break; }
    }
    const closingVal = dayData.meters[i];
    const closingNum = num(closingVal);
    const sales = (prevVal !== null && closingVal !== "" && closingVal !== undefined) ? closingNum - prevVal : null;
    const rowStatus = (sales !== null && sales < 0) ? "check" : "ok";
    const totalSales = calc.meterSales || 0;
    const share = (sales !== null && totalSales > 0) ? (sales/totalSales*100) : null;
    return `
      <tr>
        <td>Pump ${esc(pumpLabel(fuel, i))}</td>
        <td class="cell-readonly">${prevVal===null?'—':fmt(prevVal)}</td>
        <td><input class="cell-input cell-editable grid-cell" data-nav-row="${i}" data-nav-col="0" data-role="meter" data-fuel="${fuel.key}" data-day="${dayNum}" data-idx="${i}" value="${esc(closingVal||'')}" placeholder="0"/></td>
        <td class="cell-calculated" id="pumpSales-${i}">${sales===null?'—':fmt(sales)}</td>
        <td id="pumpShare-${i}">${share===null?'—':fmt(share,1)+'%'}</td>
        <td><span class="status-pill ${rowStatus}" id="pumpStatus-${i}">${rowStatus==='ok'?'OK':'Check'}</span></td>
      </tr>`;
  }).join("");

  const openingMeterRow = calc.usedOverrideMeter ? `
    <div style="margin:10px 0 4px;font-size:11.5px;color:var(--text-muted);">No prior day found — enter each pump's last known closing reading as this month's opening:</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:10px;">
      ${Array.from({length: fuel.meters}).map((_,i) => `
        <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;">Pump ${esc(pumpLabel(fuel, i))} opening</div>
        <input class="cell-input textbox" data-role="openingMeter" data-fuel="${fuel.key}" data-day="${dayNum}" data-idx="${i}" value="${esc((dayData.openingMeters||[])[i]||'')}" placeholder="0"/></div>`).join("")}
    </div>` : "";

  // tank rows
  const tankRows = Array.from({length: fuel.tanks}).map((_, i) => {
    let prevVal = null;
    for (let p = dayNum-1; p>=1; p--) {
      const pv = state.days[p] && state.days[p][fuel.key] && state.days[p][fuel.key].tanks && state.days[p][fuel.key].tanks[i];
      if (pv !== "" && pv !== undefined && pv !== null) { prevVal = num(pv); break; }
    }
    const closingVal = dayData.tanks[i];
    return `
      <tr>
        <td>Tank ${i+1}</td>
        <td class="cell-readonly">${prevVal===null?'—':fmt(prevVal)}</td>
        <td><input class="cell-input cell-editable grid-cell" data-nav-row="${i}" data-nav-col="1" data-role="tank" data-fuel="${fuel.key}" data-day="${dayNum}" data-idx="${i}" value="${esc(closingVal||'')}" placeholder="0"/></td>
      </tr>`;
  }).join("");

  const openingTankRow = calc.usedOverrideTank ? `
    <div style="margin:10px 0 4px;font-size:11.5px;color:var(--text-muted);">No prior day found — enter each tank's last known closing dip as this month's opening:</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:10px;">
      ${Array.from({length: fuel.tanks}).map((_,i) => `
        <div><div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;">Tank ${i+1} opening</div>
        <input class="cell-input textbox" data-role="openingTank" data-fuel="${fuel.key}" data-day="${dayNum}" data-idx="${i}" value="${esc((dayData.openingTanks||[])[i]||'')}" placeholder="0"/></div>`).join("")}
    </div>` : "";

  const fuelStatus = calc.gainLoss === null ? "ok" : Math.abs(calc.gainLoss) > 0 && computeMonthSummary(fuel.key, state.days, state.config, state.config.tolerancePct||0.4).alert ? "check" : "ok";

  return `
    <div class="grid-toolbar">
      <div class="segmented" id="fuelTabs">${fuelTabsHTML}</div>
      <div style="flex:1;"></div>
      <button class="icon-btn" id="entryDayPrev">${iconSVG('chevronleft',16)}</button>
      <div style="display:flex;gap:3px;overflow-x:auto;max-width:420px;">${dayButtons}</div>
      <button class="icon-btn" id="entryDayNext">${iconSVG('chevronright',16)}</button>
      <span id="entrySaveStatus" style="font-size:12px;color:var(--text-muted);margin-left:6px;">${state.saveStatus==='saving'?'Saving…':'Saved'}</span>
    </div>

    ${calc.meterError ? `<div class="panel" id="entryMeterErrorBanner" style="padding:10px 14px;margin-bottom:14px;color:var(--danger);background:var(--danger-bg);border-color:var(--danger);font-size:12.5px;display:flex;align-items:center;gap:8px;">${iconSVG('alert',15)} Opening meter total is higher than today's closing total for ${esc(fuel.name)} — check readings before continuing.</div>` : `<div class="panel" id="entryMeterErrorBanner" style="padding:10px 14px;margin-bottom:14px;color:var(--danger);background:var(--danger-bg);border-color:var(--danger);font-size:12.5px;display:none;align-items:center;gap:8px;">${iconSVG('alert',15)} Opening meter total is higher than today's closing total for ${esc(fuel.name)} — check readings before continuing.</div>`}

    <div class="panel" style="padding:18px;margin-bottom:16px;">
      <div class="section-title">Pump readings — ${esc(fuel.name)}, Day ${dayNum}</div>
      ${openingMeterRow}
      <div style="overflow:auto;max-height:360px;">
        <table class="datagrid">
          <thead><tr><th>Pump</th><th>Opening</th><th>Closing</th><th>Sales (L)</th><th>Share %</th><th>Status</th></tr></thead>
          <tbody>${pumpRows}</tbody>
        </table>
      </div>
      <div style="display:flex;gap:24px;margin-top:12px;font-size:13px;">
        <div><span style="color:var(--text-muted);">Total opening: </span><b id="totalOpening">${fmt(calc.meterOpening)}</b></div>
        <div><span style="color:var(--text-muted);">Total closing: </span><b id="totalClosing">${fmt(calc.meterClosing)}</b></div>
        <div><span style="color:var(--text-muted);">Meter sales: </span><b id="totalMeterSales">${calc.meterSales===null?'—':fmt(calc.meterSales)}</b></div>
      </div>
    </div>

    <div class="panel" style="padding:18px;">
      <div class="section-title">Tank dips — ${esc(fuel.name)}, Day ${dayNum}</div>
      ${openingTankRow}
      <div style="overflow:auto;max-height:220px;margin-bottom:14px;">
        <table class="datagrid">
          <thead><tr><th>Tank</th><th>Opening</th><th>Closing</th></tr></thead>
          <tbody>${tankRows}</tbody>
        </table>
      </div>
      <div class="field-row">
        <div><div class="field-label">Deliveries today (whole fuel)</div>
          <input class="numbox cell-editable" data-role="deliveries" data-fuel="${fuel.key}" data-day="${dayNum}" value="${esc(dayData.deliveries||'')}" placeholder="0"/></div>
        <div><div class="field-label">Meter tests (returned to tank)</div>
          <input class="numbox cell-editable" data-role="meterTest" data-fuel="${fuel.key}" data-day="${dayNum}" value="${esc(dayData.meterTest||'')}" placeholder="0"/></div>
      </div>
      <div class="section-title" style="margin-top:6px;">Fuel summary</div>
      <table class="datagrid">
        <thead><tr><th>Opening</th><th>Delivery</th><th>Meter test</th><th>Closing</th><th>Calc. stock</th><th>Tank sales</th><th>Gain / (loss)</th><th>Status</th></tr></thead>
        <tbody><tr>
          <td class="cell-readonly" id="fsOpening">${fmt(calc.tankOpening)}</td>
          <td class="cell-readonly" id="fsDelivery">${fmt(calc.deliveries)}</td>
          <td class="cell-readonly" id="fsMeterTest">${fmt(calc.meterTest)}</td>
          <td class="cell-readonly" id="fsClosing">${fmt(calc.tankClosing)}</td>
          <td class="cell-calculated" id="fsStock">${fmt(calc.tankStock)}</td>
          <td class="cell-calculated" id="fsTankSales">${calc.tankSales===null?'—':fmt(calc.tankSales)}</td>
          <td class="${calc.gainLoss!==null && calc.gainLoss<0 ? 'cell-error':'cell-calculated'}" id="fsGainLoss">${calc.gainLoss===null?'—':fmtSigned(calc.gainLoss)}</td>
          <td><span class="status-pill ${fuelStatus}" id="fsStatus">${fuelStatus==='ok'?'OK':'Check'}</span></td>
        </tr></tbody>
      </table>
    </div>
  `;
}

function updateEntryComputedOnly() {
  // structural change (day/fuel switch) — full rebuild is correct here, inputs are all new anyway
  document.getElementById("app-content").innerHTML = renderEntryPage();
  wireEntryPageEvents(true);
}

function setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; }

function refreshEntryComputed() {
  // keystroke-level update — touches ONLY computed/read-only nodes, never the inputs themselves,
  // so focus and cursor position are never disturbed while typing
  const fuel = state.config.fuels.find(f => f.key === state.entryFuel) || state.config.fuels[0];
  const dayNum = state.activeDay;
  const dayData = (state.days[dayNum] && state.days[dayNum][fuel.key]) || emptyDayFuel(fuel.meters, fuel.tanks);
  const calc = computeDay(fuel.key, dayNum, state.days, state.config);

  for (let i = 0; i < fuel.meters; i++) {
    let prevVal = null;
    for (let p = dayNum-1; p>=1; p--) {
      const pv = state.days[p] && state.days[p][fuel.key] && state.days[p][fuel.key].meters && state.days[p][fuel.key].meters[i];
      if (pv !== "" && pv !== undefined && pv !== null) { prevVal = num(pv); break; }
    }
    const closingVal = dayData.meters[i];
    const closingNum = num(closingVal);
    const sales = (prevVal !== null && closingVal !== "" && closingVal !== undefined) ? closingNum - prevVal : null;
    const rowStatus = (sales !== null && sales < 0) ? "check" : "ok";
    const totalSales = calc.meterSales || 0;
    const share = (sales !== null && totalSales > 0) ? (sales/totalSales*100) : null;
    setText(`pumpSales-${i}`, sales===null?'—':fmt(sales));
    setText(`pumpShare-${i}`, share===null?'—':fmt(share,1)+'%');
    const statusEl = document.getElementById(`pumpStatus-${i}`);
    if (statusEl) { statusEl.className = `status-pill ${rowStatus}`; statusEl.textContent = rowStatus==='ok'?'OK':'Check'; }
  }

  setText('totalOpening', fmt(calc.meterOpening));
  setText('totalClosing', fmt(calc.meterClosing));
  setText('totalMeterSales', calc.meterSales===null?'—':fmt(calc.meterSales));

  setText('fsOpening', fmt(calc.tankOpening));
  setText('fsDelivery', fmt(calc.deliveries));
  setText('fsMeterTest', fmt(calc.meterTest));
  setText('fsClosing', fmt(calc.tankClosing));
  setText('fsStock', fmt(calc.tankStock));
  setText('fsTankSales', calc.tankSales===null?'—':fmt(calc.tankSales));
  setText('fsGainLoss', calc.gainLoss===null?'—':fmtSigned(calc.gainLoss));
  const glCell = document.getElementById('fsGainLoss');
  if (glCell) glCell.className = (calc.gainLoss!==null && calc.gainLoss<0) ? 'cell-error' : 'cell-calculated';

  const fuelStatus = calc.gainLoss === null ? "ok" : (computeMonthSummary(fuel.key, state.days, state.config, state.config.tolerancePct||0.4).alert ? "check" : "ok");
  const fsStatusEl = document.getElementById('fsStatus');
  if (fsStatusEl) { fsStatusEl.className = `status-pill ${fuelStatus}`; fsStatusEl.textContent = fuelStatus==='ok'?'OK':'Check'; }

  const banner = document.getElementById('entryMeterErrorBanner');
  if (banner) banner.style.display = calc.meterError ? 'flex' : 'none';
}

/* =================================================================
   PAGE: PUMP PERFORMANCE
================================================================= */
function renderPumpsPage() {
  const cards = state.config.fuels.map(fuel => {
    const { ranked, maxAvg } = computePumpStats(fuel.key, state.config, state.days);
    const anyData = ranked.some(r => r.daysCounted > 0);
    const rows = anyData ? ranked.map((r, rank) => `
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;">
          <div style="display:flex;align-items:center;gap:6px;">
            ${rank===0 && r.daysCounted>0 ? `<span style="width:12px;height:12px;color:var(--accent);">${iconSVG('trophy',12)}</span>` : ""}
            <span style="font-size:13px;font-weight:${rank===0?'600':'400'};">Pump ${esc(pumpLabel(fuel, r.index))}</span>
          </div>
          <span style="font-size:12.5px;color:var(--text-muted);">${r.daysCounted>0?fmt(r.avg)+' L/day avg':'—'}</span>
        </div>
        <div class="tank-bar-track"><div class="tank-bar-fill" style="width:${Math.max(2,(r.avg/maxAvg)*100)}%;background:${rank===0?'var(--accent)':'var(--accent-soft)'};"></div></div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${r.daysCounted>0?fmt(r.total)+' L total over '+r.daysCounted+' days':'No data yet'}</div>
      </div>`).join("") : `<div style="font-size:12.5px;color:var(--text-muted);padding:10px 0;">Not enough consecutive daily readings yet.</div>`;
    return `<div class="panel" style="padding:18px;">
      <div class="section-title">${esc(fuel.name)}</div>${rows}</div>`;
  }).join("");
  return `<div class="grid-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">${cards}</div>`;
}

          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card-raised);border-radius:8px;border:1px solid var(--border-soft);">
            <div><div style="font-weight:600;font-size:13.5px;">${r.label}</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">${r.desc}</div></div>

function generateReportRows(reportId) {
  const tol = state.config.tolerancePct || 0.4;
  if (reportId === "daily") {
    const rows = [["Fuel","Day","Opening Meter","Closing Meter","Meter Sales","Opening Dip","Closing Dip","Tank Sales","Gain/Loss"]];
    state.config.fuels.forEach(f => {
      const ld = lastEnteredDay(f.key) || state.activeDay;
      const c = computeDay(f.key, ld, state.days, state.config);
      rows.push([f.name, ld, fmt(c.meterOpening), fmt(c.meterClosing), c.meterSales===null?'':fmt(c.meterSales), fmt(c.tankOpening), fmt(c.tankClosing), c.tankSales===null?'':fmt(c.tankSales), c.gainLoss===null?'':fmt(c.gainLoss)]);
    });
    return rows;
  }
  if (reportId === "monthly") {
    const rows = [["Fuel","Opening Dip","Deliveries","Closing Dip","Tank Throughput","Opening Meter","Meter Testing","Closing Meter","Meter Throughput","Gain/Loss","% of Throughput","Alert"]];
    state.config.fuels.forEach(f => {
      const s = computeMonthSummary(f.key, state.days, state.config, tol);
      rows.push([f.name, fmt(s.openingDip), fmt(s.totalDeliveries), fmt(s.closingDip), fmt(s.tankThroughput), fmt(s.openingMeter), fmt(s.totalMeterTest), fmt(s.closingMeter), fmt(s.meterThroughput), fmt(s.monthGainLoss), fmt(s.pctOfThroughput*100,3)+"%", s.alert?"ALERT":""]);
    });
    return rows;
  }
  if (reportId === "variance") {
    const rows = [["Day", ...state.config.fuels.map(f=>f.name+" Gain/Loss")]];
    for (let n=1;n<=DAYS_IN_MONTH;n++) {
      const vals = state.config.fuels.map(f => { const c = computeDay(f.key,n,state.days,state.config); return c.entered ? fmt(c.gainLoss) : ""; });
      if (vals.some(v=>v!=="")) rows.push([n, ...vals]);
    }
    return rows;
  }
  if (reportId === "pumps") {
    const rows = [["Fuel","Pump","Avg L/day","Total L","Days counted"]];
    state.config.fuels.forEach(f => {
      const { ranked } = computePumpStats(f.key, state.config, state.days);
      ranked.forEach(r => rows.push([f.name, "Pump "+pumpLabel(f, r.index), fmt(r.avg), fmt(r.total), r.daysCounted]));
    });
    return rows;
  }
  if (reportId === "inventory") {
    const rows = [["Fuel","Current Stock (L)","Capacity (L)"]];
    state.config.fuels.forEach(f => {
      const ld = lastEnteredDay(f.key);
      const level = ld ? computeDay(f.key, ld, state.days, state.config).tankClosing : 0;
      rows.push([f.name, fmt(level), f.capacityLitres || "not set"]);
    });
    return rows;
  }
  return [["No data"]];
}

function getFilteredSortedDeliveries() {
  const q = (state.deliveryFilter || "").toLowerCase();
  let rows = state.deliveryLog.filter(r => {
    if (!q) return true;
    const fuelName = (state.config.fuels.find(f => f.key === r.fuel) || {}).name || r.fuel;
    return [String(r.day), fuelName, r.supplier, r.driver, r.invoice, r.notes].some(v => (v || "").toLowerCase().includes(q));
  });
  const { col, dir } = state.deliverySort;
  rows = rows.slice().sort((a, b) => {
    let av, bv;
    if (col === "fuel") { av = (state.config.fuels.find(f => f.key === a.fuel) || {}).name || ""; bv = (state.config.fuels.find(f => f.key === b.fuel) || {}).name || ""; }
    else if (col === "volume" || col === "day") { av = num(a[col]); bv = num(b[col]); }
    else { av = (a[col] || "").toLowerCase(); bv = (b[col] || "").toLowerCase(); }
    if (av < bv) return dir === "asc" ? -1 : 1;
    if (av > bv) return dir === "asc" ? 1 : -1;
    return 0;
  });
  return rows;
}
function deliveryTableInnerHTML() {
  const rows = getFilteredSortedDeliveries();
  if (!rows.length) {
    return `<div class="empty-state"><div class="icon-wrap">${iconSVG('truck',22)}</div>
      <div style="font-weight:600;font-size:14px;color:var(--text);margin-bottom:6px;">${state.deliveryLog.length?'No deliveries match your search':'No deliveries logged yet'}</div>
      <div style="font-size:12.5px;">${state.deliveryLog.length?'Try a different search term.':'Use the form above to log your first delivery.'}</div></div>`;
  }
  const arrow = (col) => state.deliverySort.col===col ? (state.deliverySort.dir==='asc'?' ▲':' ▼') : '';
  const rowsHTML = rows.map(r => {
    const fuelName = (state.config.fuels.find(f => f.key === r.fuel) || {}).name || r.fuel;
    return `<tr>
      <td>Day ${esc(r.day)}</td>
      <td>${esc(fuelName)}</td>
      <td>${fmt(num(r.volume))} L</td>
      <td>${esc(r.supplier||'—')}</td>

    </tr>`;
  }).join("");
  return `<table class="datagrid">
    <thead><tr>
      <th data-sort="day" style="cursor:pointer;">Day${arrow('day')}</th>
      <th data-sort="fuel" style="cursor:pointer;">Fuel${arrow('fuel')}</th>
      <th data-sort="volume" style="cursor:pointer;">Volume${arrow('volume')}</th>
      <th data-sort="supplier" style="cursor:pointer;">Supplier${arrow('supplier')}</th>
      <th data-sort="driver" style="cursor:pointer;">Driver${arrow('driver')}</th>
      <th data-sort="invoice" style="cursor:pointer;">Invoice${arrow('invoice')}</th>
      <th>Notes</th><th></th>
    </tr></thead>
    <tbody>${rowsHTML}</tbody>
  </table>`;
}
function refreshDeliveryTable() {
  const wrap = document.getElementById('deliveryTableWrap');
  if (wrap) wrap.innerHTML = deliveryTableInnerHTML();
  setText('deliveryCount', `${getFilteredSortedDeliveries().length} of ${state.deliveryLog.length} deliveries`);
  document.querySelectorAll('#deliveryTableWrap th[data-sort]').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.sort;
      if (state.deliverySort.col === col) state.deliverySort.dir = state.deliverySort.dir === 'asc' ? 'desc' : 'asc';
      else state.deliverySort = { col, dir: 'asc' };
      refreshDeliveryTable();
    };
  });
  document.querySelectorAll('#deliveryTableWrap button[data-del-id]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.delId;
      const rec = state.deliveryLog.find(r => r.id === id);
      if (!rec) return;
      if (state.days[rec.day] && state.days[rec.day][rec.fuel]) {
        const cur = num(state.days[rec.day][rec.fuel].deliveries);
        const next = Math.max(0, cur - num(rec.volume));
        state.days[rec.day][rec.fuel].deliveries = next === 0 ? "" : String(next);
      }
      state.deliveryLog = state.deliveryLog.filter(r => r.id !== id);
      const fuelName = (state.config.fuels.find(f => f.key === rec.fuel) || {}).name || rec.fuel;
      pushActivity("delivery", `Delivery removed (${fuelName}, Day ${rec.day})`);
      scheduleSave("Delivery removed");
      toast("Delivery removed");
      refreshDeliveryTable();
    };
  });
}

function rememberSupplier(name) {
  if (!name) return;
  state.config.suppliers = state.config.suppliers || [];
  if (!state.config.suppliers.some(s => s.toLowerCase() === name.toLowerCase())) state.config.suppliers.push(name);
}
function addDeliveryRecord({ day, fuelKey, volume, supplier, driver, invoice, notes }) {
  const fuelCfg = state.config.fuels.find(f => f.key === fuelKey);
  if (!fuelCfg || !(volume > 0)) return false;
  const rec = { id: 'd'+Date.now()+Math.random().toString(36).slice(2,7), day, fuel: fuelKey, volume: String(volume), supplier: supplier||"", driver: driver||"", invoice: invoice||"", notes: notes||"", ts: Date.now() };
  state.deliveryLog.push(rec);
  if (!state.days[day]) state.days[day] = {};
  if (!state.days[day][fuelKey]) state.days[day][fuelKey] = emptyDayFuel(fuelCfg.meters, fuelCfg.tanks);
  const cur = num(state.days[day][fuelKey].deliveries);
  state.days[day][fuelKey].deliveries = String(cur + volume);
  if (supplier) rememberSupplier(supplier);
  pushActivity('delivery', `${fuelCfg.name} delivery logged: ${fmt(volume)} L (Day ${day})${supplier?' from '+supplier:''}`);
  return true;
}
function wireDeliveriesPageEvents() {
  document.getElementById('addDeliveryBtn').onclick = () => {
    const day = Math.max(1, Math.min(DAYS_IN_MONTH, parseInt(document.getElementById('newDelDay').value, 10) || state.activeDay));
    const fuelKey = document.getElementById('newDelFuel').value;
    const volumeRaw = document.getElementById('newDelVolume').value;
    const volume = num(volumeRaw);
    if (!volumeRaw || volume <= 0) { toast('Enter a delivery volume greater than 0', 'danger'); return; }
    const supplier = document.getElementById('newDelSupplier').value;
    const driver = document.getElementById('newDelDriver').value;
    const invoice = document.getElementById('newDelInvoice').value;
    const notes = document.getElementById('newDelNotes').value;
    addDeliveryRecord({ day, fuelKey, volume, supplier, driver, invoice, notes });
    scheduleSave('Delivery added');
    toast('Delivery added');
    ['newDelVolume','newDelSupplier','newDelDriver','newDelInvoice','newDelNotes'].forEach(id => { document.getElementById(id).value = ''; });
    refreshDeliveryTable();
  };
  document.getElementById('quickDelBtn').onclick = () => {
    const day = Math.max(1, Math.min(DAYS_IN_MONTH, parseInt(document.getElementById('quickDelDay').value, 10) || state.activeDay));
    const supplier = document.getElementById('quickDelSupplier').value;
    const raw = document.getElementById('quickDelCodes').value.trim();
    if (!raw) { toast('Type at least one code-volume pair', 'danger'); return; }
    const pairRe = /([A-Za-z0-9]+)\s*-\s*(\d+(?:\.\d+)?)/g;
    let matched = 0, added = 0; const failed = []; let m;
    while ((m = pairRe.exec(raw)) !== null) {
      matched++;
      const code = m[1], volume = parseFloat(m[2]);
      const fuelCfg = state.config.fuels.find(f => (f.code||'').toLowerCase() === code.toLowerCase());
      if (!fuelCfg) { failed.push(m[0]); continue; }
      if (addDeliveryRecord({ day, fuelKey: fuelCfg.key, volume, supplier, notes: 'Bulk entry' })) added++;
    }
    if (!matched) { toast('Couldn\'t find any code-volume pairs — try e.g. "91-2500 95-5274 d-5455"', 'danger'); return; }
    if (added) { scheduleSave('Bulk deliveries added'); toast(`${added} deliver${added===1?'y':'ies'} added for Day ${day}`); document.getElementById('quickDelCodes').value = ''; refreshDeliveryTable(); }
    if (failed.length) toast(`Couldn't match: ${failed.join(', ')} — check fuel codes in Settings`, 'danger');
  };
  document.getElementById('quickDelCodes').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('quickDelBtn').click(); } });
  document.getElementById('deliverySearch').addEventListener('input', (e) => {
    state.deliveryFilter = e.target.value;
    refreshDeliveryTable();
  });
  refreshDeliveryTable();
}

function renderInventoryPage() {
  const cards = state.config.fuels.map(f => {
    const ld = lastEnteredDay(f.key);
    const level = ld ? computeDay(f.key, ld, state.days, state.config).tankClosing : 0;
    const cap = f.capacityLitres;
    const alert = computeStockAlert(f.key);
    let pct = null, color = 'var(--text-muted)', statusLabel = 'Set capacity to track';
    if (cap && cap > 0) {
      pct = Math.max(0, Math.min(100, (level/cap)*100));
      color = pct > 40 ? 'var(--success)' : pct > 15 ? 'var(--warning)' : 'var(--danger)';
      statusLabel = pct > 40 ? 'Healthy' : pct > 15 ? 'Watch' : 'Reorder soon';
    }
    let warningHTML = '';
    if (alert.level === 'critical') {
      warningHTML = `<div style="display:flex;gap:6px;align-items:center;color:var(--danger);background:var(--danger-bg);padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;margin-top:10px;">${iconSVG('alert',13)} Need delivery — only ${fmt(Math.max(0,alert.daysUntilDead),1)} day${Math.abs(alert.daysUntilDead-1)<0.05?'':'s'} of sellable stock left</div>`;
    } else if (alert.level === 'watch') {
      warningHTML = `<div style="display:flex;gap:6px;align-items:center;color:var(--warning);background:var(--warning-bg);padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;margin-top:10px;">${iconSVG('alert',13)} Delivery due soon — ${fmt(alert.daysUntilDead,1)} days of sellable stock left</div>`;
    }
    return `
      <div class="panel" style="padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="width:15px;height:15px;color:var(--accent);">${iconSVG('drop',15)}</span>
            <span class="display" style="font-weight:700;font-size:15px;">${esc(f.name)}</span>
          </div>
          ${cap ? `<span class="status-pill ${pct>40?'ok':'check'}">${statusLabel}</span>` : ''}
        </div>
        <div style="font-size:27px;font-weight:700;">${fmt(level)} <span style="font-size:14px;color:var(--text-muted);font-weight:500;">L</span></div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Current stock${cap?' · '+fmt(cap)+' L capacity':''}</div>
        ${cap ? `<div class="tank-bar-track" style="margin-bottom:16px;"><div class="tank-bar-fill" style="width:${pct}%;background:${color};"></div></div>`
              : `<div class="placeholder-box" style="margin-bottom:16px;">Set a tank capacity in Settings to see fill %, colour-coded status, and a days-remaining estimate.</div>`}
        <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;"><span style="color:var(--text-muted);">Average daily usage</span><b>${alert.avgDailySales>0?fmt(alert.avgDailySales)+' L':'—'}</b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;"><span style="color:var(--text-muted);">Dead stock / safety margin</span><b>${fmt(alert.deadStock)} L + ${fmt(alert.safetyDays)}d</b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;"><span style="color:var(--text-muted);">Days until unpumpable</span><b style="${alert.level!=='none'?'color:'+(alert.level==='critical'?'var(--danger)':'var(--warning)')+';':''}">${alert.daysUntilDead!==null?fmt(alert.daysUntilDead,1)+' days':'—'}</b></div>
        ${warningHTML}
      </div>`;
  }).join("");
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">${cards}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:16px;">Days-remaining is estimated from this month's average daily meter sales — it doesn't account for weekends, seasonal swings, or deliveries you haven't logged yet.</div>`;
}

/* =================================================================
   PAGE: ANALYTICS (still phase 2)
================================================================= */
function renderAnalyticsPage() {
  const weeks = [[1,7],[8,14],[15,21],[22,28],[29,31]];
  const rows = state.config.fuels.map(f => {
    const weekAvgs = weeks.map(([start,end]) => {
      let total = 0, count = 0, prevClosing = null;
      for (let n = start; n <= end; n++) {
        const raw = state.days[n] && state.days[n][f.key] && state.days[n][f.key].meters;
        if (!hasAny(raw)) continue;
        const closing = sumArr(raw);
        if (prevClosing !== null) { const sales = closing - prevClosing; if (sales >= 0) { total += sales; count++; } }
        prevClosing = closing;
      }
      return count > 0 ? total / count : null;
    });
    const s = computeMonthSummary(f.key, state.days, state.config, state.config.tolerancePct || 0.4);
    const daysSpan = (s.lastDayNum && s.firstDayNum) ? (s.lastDayNum - s.firstDayNum + 1) : 0;
    const monthAvg = daysSpan > 0 ? s.meterThroughput / daysSpan : null;
    return { fuel: f, weekAvgs, monthAvg };
  });

  const tableRows = rows.map(r => `
    <tr>
      <td style="font-weight:600;">${esc(r.fuel.name)}</td>
      ${r.weekAvgs.map(w => `<td>${w!==null?fmt(w)+' L':'—'}</td>`).join("")}
      <td class="cell-calculated">${r.monthAvg!==null?fmt(r.monthAvg)+' L':'—'}</td>
    </tr>`).join("");

  const maxWeekly = Math.max(1, ...rows.flatMap(r => r.weekAvgs.filter(v => v!==null)));
  const barsHTML = rows.map((r, ri) => `
    <div style="margin-bottom:18px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">${esc(r.fuel.name)}</div>
      <div style="display:flex;gap:8px;align-items:flex-end;height:90px;">
        ${r.weekAvgs.map((w, wi) => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
            <div style="width:100%;max-width:34px;background:${w!==null?'var(--accent)':'var(--border-soft)'};border-radius:5px 5px 0 0;height:${w!==null?Math.max(4,(w/maxWeekly)*100):3}%;"></div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:5px;">W${wi+1}</div>
          </div>`).join("")}
      </div>
    </div>`).join("");

  return `
    <div class="panel" style="padding:18px;margin-bottom:16px;">
      <div class="section-title">Average daily sales per grade — weekly breakdown</div>
      ${barsHTML}
      <div style="font-size:11px;color:var(--text-muted);">Weeks are simple calendar buckets within the month: W1 = days 1–7, W2 = 8–14, W3 = 15–21, W4 = 22–28, W5 = 29–31.</div>
    </div>
    <div class="panel" style="padding:18px;">
      <div class="section-title">Average daily sales — table</div>
      <table class="datagrid">
        <thead><tr><th>Fuel</th><th>Week 1</th><th>Week 2</th><th>Week 3</th><th>Week 4</th><th>Week 5</th><th>Month avg</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

function renderPhase2Placeholder(pageId) {
  const meta = {}[pageId] || { icon: "barchart", title: "Coming soon", body: "" };
  return `
    <div class="panel">
      <div class="empty-state">
        <div class="icon-wrap">${iconSVG(meta.icon,24)}</div>
        <div style="font-weight:600;font-size:15px;color:var(--text);margin-bottom:6px;">${meta.title}</div>
        <div style="font-size:13px;max-width:420px;">${meta.body}</div>
      </div>
    </div>`;
}

/* =================================================================
   PAGE: HELP
================================================================= */
function renderHelpPage() {
  return `
    <div class="panel" style="padding:18px;">
      <div class="section-title">How the reconciliation works</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text-dim);">
        Each day, for each fuel grade: <b>Meter sales</b> = today's closing pump meter total minus yesterday's closing total.
        <b>Tank sales</b> = (opening dip + deliveries + meter tests) minus today's closing dip. The difference between the two
        is the day's <b>gain/(loss)</b>. Yesterday's closing figures automatically become today's opening figures — you only
        enter a closing reading once. The Month Summary and Reports pages roll this up across the whole month, and flag any
        fuel whose variance exceeds your tolerance threshold, set in Settings.
      </div>
      <div class="section-title" style="margin-top:18px;">Keyboard shortcuts</div>
      <div style="font-size:13px;color:var(--text-dim);line-height:1.9;">
        <b>⌘K / Ctrl+K</b> — open the command palette to jump to any page<br/>
        <b>Arrow keys</b> — move between cells in the Daily Entry grid<br/>
        <b>Enter</b> — move to the next row down<br/>
      </div>
    </div>`;
}

/* =================================================================
   MAIN RENDER
================================================================= */
function renderPageContent() {
  if (state.page === "dashboard") return renderDashboard();
  if (state.page === "entry") return renderEntryPage();
  if (state.page === "deliveries") return renderDeliveriesPage();
  if (state.page === "inventory") return renderInventoryPage();
  if (state.page === "pumps") return renderPumpsPage();
  if (state.page === "analytics") return renderAnalyticsPage();
  if (state.page === "reports") return renderReportsPage();
  if (state.page === "settings") return renderSettingsPage();
  if (state.page === "help") return renderHelpPage();
  if (PHASE2_PAGES[state.page]) return renderPhase2Placeholder(state.page);
  return "";
}

function render() {
  document.body.classList.toggle("light", state.mode === "light");
  renderSidebar();
  renderHeader();
  renderStatusBar();
  document.getElementById("app-content").innerHTML = renderPageContent();
  wirePageEvents();
}

/* =================================================================
   EVENT WIRING PER PAGE
================================================================= */
function wireEntryPageEvents() {
  document.getElementById("entryDayPrev").onclick = () => { state.activeDay = Math.max(1, state.activeDay-1); updateEntryComputedOnly(); };
  document.getElementById("entryDayNext").onclick = () => { state.activeDay = Math.min(DAYS_IN_MONTH, state.activeDay+1); updateEntryComputedOnly(); };
  document.querySelectorAll("#fuelTabs button").forEach(btn => { btn.onclick = () => { state.entryFuel = btn.dataset.fuel; updateEntryComputedOnly(); }; });
  document.querySelectorAll("[data-day]").forEach(btn => {
    if (btn.tagName === "BUTTON" && btn.dataset.day) btn.onclick = () => { state.activeDay = parseInt(btn.dataset.day,10); updateEntryComputedOnly(); };
  });

  document.querySelectorAll('input[data-role]').forEach(input => {
    input.addEventListener("focus", () => { const raw = input.value.replace(/,/g, ""); input.dataset.raw = raw; input.value = raw; });
    input.addEventListener("input", () => {
      const { role, fuel, idx } = input.dataset;
      const dayNum = parseInt(input.dataset.day, 10);
      const fuelCfg = state.config.fuels.find(f => f.key === fuel);
      if (!state.days[dayNum]) state.days[dayNum] = {};
      if (!state.days[dayNum][fuel]) state.days[dayNum][fuel] = emptyDayFuel(fuelCfg.meters, fuelCfg.tanks);
      const d = state.days[dayNum][fuel];
      const v = input.value.replace(/,/g, "");
      if (v !== "" && !/^\d*\.?\d*$/.test(v)) return;
      if (role === "meter") { while (d.meters.length <= idx) d.meters.push(""); d.meters[idx] = v; }
      else if (role === "tank") { while (d.tanks.length <= idx) d.tanks.push(""); d.tanks[idx] = v; }
      else if (role === "openingMeter") { d.openingMeters = d.openingMeters||[]; while (d.openingMeters.length <= idx) d.openingMeters.push(""); d.openingMeters[idx] = v; }
      else if (role === "openingTank") { d.openingTanks = d.openingTanks||[]; while (d.openingTanks.length <= idx) d.openingTanks.push(""); d.openingTanks[idx] = v; }
      else if (role === "deliveries") { d.deliveries = v; }
      else if (role === "meterTest") { d.meterTest = v; }
      scheduleSave("Reading saved");
      refreshEntryComputed();
    });
    input.addEventListener("blur", () => {
      formatOnBlur(input);
      const { role, fuel } = input.dataset;
      const dayNum = parseInt(input.dataset.day, 10);
      const fuelCfg = state.config.fuels.find(f => f.key === fuel);
      const raw = (input.dataset.raw || "").replace(/,/g, "");
      const now = (input.value || "").replace(/,/g, "");
      if (role === "deliveries" && now !== "" && now !== raw) pushActivity("delivery", `${fuelCfg.name} delivery logged: ${now} L (Day ${dayNum})`);
      else if (role === "meterTest" && now !== "" && now !== raw) pushActivity("meter-test", `${fuelCfg.name} meter test logged: ${now} L (Day ${dayNum})`);
      if ((role === "deliveries" || role === "meterTest") && anyAlert()) pushActivity("variance", `${fuelCfg.name} is over tolerance this month`);
    });
    input.addEventListener("keydown", (e) => {
      if (!input.classList.contains("grid-cell")) return;
      const row = parseInt(input.dataset.navRow, 10), col = input.dataset.navCol;
      const selector = `.grid-cell[data-nav-col="${col}"]`;
      const cells = Array.from(document.querySelectorAll(selector));
      const idx = cells.indexOf(input);
      if (e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); const next = cells[idx+1]; if (next) { next.focus(); next.select(); } }
      else if (e.key === "ArrowUp") { e.preventDefault(); const prev = cells[idx-1]; if (prev) { prev.focus(); prev.select(); } }
    });
  });
}
function wireSettingsPageEvents() {
  document.getElementById("setSiteName").addEventListener("input", e => { state.config.siteName = e.target.value; scheduleSave(); renderHeader(); renderSidebar(); });
  document.getElementById("setMonthLabel").addEventListener("input", e => { state.config.monthLabel = e.target.value; scheduleSave(); renderHeader(); });
  document.getElementById("setTolerance").addEventListener("input", e => { const v = parseFloat(e.target.value); state.config.tolerancePct = isNaN(v)?0:v; scheduleSave(); });
  document.getElementById("setCompanyName").addEventListener("input", e => { state.config.companyName = e.target.value; scheduleSave(); renderSidebar(); });
  document.getElementById("setCompanyAddress").addEventListener("input", e => { state.config.companyAddress = e.target.value; scheduleSave(); });
  document.getElementById("setCompanyPhone").addEventListener("input", e => { state.config.companyPhone = e.target.value; scheduleSave(); });
  document.querySelectorAll('input[data-role="fuelName"]').forEach(inp => inp.addEventListener("input", e => { state.config.fuels[parseInt(inp.dataset.idx,10)].name = e.target.value; scheduleSave(); }));
  document.querySelectorAll('input[data-role="fuelCode"]').forEach(inp => inp.addEventListener("input", e => { state.config.fuels[parseInt(inp.dataset.idx,10)].code = e.target.value; scheduleSave(); }));
  document.querySelectorAll('input[data-role="fuelDeadStock"]').forEach(inp => inp.addEventListener("input", e => {
    const v = parseFloat(e.target.value); state.config.fuels[parseInt(inp.dataset.idx,10)].deadStockLitres = isNaN(v)?1000:v; scheduleSave();
  }));
  document.querySelectorAll('input[data-role="fuelSafetyDays"]').forEach(inp => inp.addEventListener("input", e => {
    const v = parseFloat(e.target.value); state.config.fuels[parseInt(inp.dataset.idx,10)].safetyDays = isNaN(v)?2:v; scheduleSave();
  }));
  document.querySelectorAll('input[data-role="pumpLabel"]').forEach(inp => inp.addEventListener("input", e => {
    const f = state.config.fuels[parseInt(inp.dataset.idx,10)];
    const i = parseInt(inp.dataset.pumpi,10);
    if (!f.pumpLabels) f.pumpLabels = Array.from({length:f.meters},(_,k)=>String(k+1));
    while (f.pumpLabels.length < f.meters) f.pumpLabels.push(String(f.pumpLabels.length+1));
    f.pumpLabels[i] = e.target.value;
    scheduleSave();
  }));
  document.querySelectorAll('input[data-role="fuelCapacity"]').forEach(inp => inp.addEventListener("input", e => {
    const v = parseFloat(e.target.value); state.config.fuels[parseInt(inp.dataset.idx,10)].capacityLitres = isNaN(v)?null:v; scheduleSave();
  }));
  document.querySelectorAll('button[data-role="stepMeters"]').forEach(btn => btn.onclick = () => {
    const f = state.config.fuels[parseInt(btn.dataset.idx,10)];
    const oldCount = f.meters;
    f.meters = Math.max(1, Math.min(16, f.meters+parseInt(btn.dataset.dir,10)));
    if (f.pumpLabels) {
      if (f.meters > oldCount) { while (f.pumpLabels.length < f.meters) f.pumpLabels.push(String(f.pumpLabels.length+1)); }
      else { f.pumpLabels = f.pumpLabels.slice(0, f.meters); }
    }
    scheduleSave(); render();
  });
  document.querySelectorAll('button[data-role="stepTanks"]').forEach(btn => btn.onclick = () => {
    const f = state.config.fuels[parseInt(btn.dataset.idx,10)]; f.tanks = Math.max(1, Math.min(6, f.tanks+parseInt(btn.dataset.dir,10))); scheduleSave(); render();
  });
  document.getElementById("addSupplierBtn").onclick = () => {
    const inp = document.getElementById("newSupplierInput");
    const v = inp.value.trim();
    if (!v) return;
    state.config.suppliers = state.config.suppliers || [];
    if (!state.config.suppliers.some(s => s.toLowerCase() === v.toLowerCase())) state.config.suppliers.push(v);
    inp.value = "";
    scheduleSave();
    render();
  };
  document.querySelectorAll('button[data-role="removeSupplier"]').forEach(btn => btn.onclick = () => {
    state.config.suppliers.splice(parseInt(btn.dataset.idx,10), 1);
    scheduleSave();
    render();
  });
  document.getElementById("settingsThemeToggle").onclick = () => document.getElementById("themeToggleBtn").click();
  document.getElementById("doBackup").onclick = downloadBackup;
  document.getElementById("restoreFile").addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.config) state.config = normalizeConfig(Object.assign(defaultConfig(), parsed.config));
        if (parsed.days) state.days = parsed.days;
        if (parsed.activity) state.activity = parsed.activity;
        if (parsed.deliveryLog) state.deliveryLog = parsed.deliveryLog;
        scheduleSave("Backup restored");
        toast("Backup restored");
        render();
      } catch (err) { toast("Couldn't read that backup file", "danger"); }
    };
    reader.readAsText(file);
  });
}
function wireReportsPageEvents() {
  document.querySelectorAll('button[data-report]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.report;
      if (btn.dataset.export === "csv") downloadCSV(id + "-report.csv", generateReportRows(id));
      else window.print();
    };
  });
}
function wirePageEvents() {
  if (state.page === "entry") wireEntryPageEvents();
  else if (state.page === "settings") wireSettingsPageEvents();
  else if (state.page === "reports") wireReportsPageEvents();
  else if (state.page === "deliveries") wireDeliveriesPageEvents();
}

/* =================================================================
   INIT
================================================================= */
(async function init() {
  try {
    const raw = await storageAdapter.get(STORAGE_KEY, true);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.config) state.config = normalizeConfig(Object.assign(defaultConfig(), parsed.config));
      if (parsed.days) state.days = parsed.days;
      if (parsed.activity) state.activity = parsed.activity;
      if (parsed.deliveryLog) state.deliveryLog = parsed.deliveryLog;
    }
  } catch (e) {}
  try { const t = await storageAdapter.get(THEME_KEY, false); if (t==="light"||t==="dark") state.mode = t; } catch(e) {}
  try { const s = await storageAdapter.get(SIDEBAR_KEY, false); if (s==="1") state.sidebarCollapsed = true; } catch(e) {}
  if (!state.activity.length) pushActivity("save", "Session started");
  render();
})();
</script>
